<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lock.js" defer></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg: #0A0A0B;
  --bg-deep: #050506;
  --bg-card: rgba(255,255,255,0.04);
  --border-soft: rgba(255,255,255,0.05);
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --glass-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 12px 40px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.25);
  --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100%;
}

body::before {
  content: ''; position: fixed; inset: -10%; z-index: -2;
  background:
    radial-gradient(60% 45% at 82% 14%, rgba(224,118,88,0.16) 0%, transparent 55%),
    radial-gradient(55% 45% at 18% 90%, rgba(180,180,200,0.06) 0%, transparent 55%),
    linear-gradient(180deg, #0A0A0B 0%, #050506 100%);
  filter: blur(40px) saturate(1.05);
  pointer-events: none;
  animation: drift 36s ease-in-out infinite alternate;
}

body::after {
  content: ''; position: fixed; inset: 0; z-index: -1;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  opacity: 0.7; pointer-events: none;
}

@keyframes drift {
  0%   { transform: translate(0, 0); }
  100% { transform: translate(-2%, 2%); }
}

.page {
  max-width: 980px;
  margin: 0 auto;
  padding: 20px max(18px, env(safe-area-inset-right)) 100px max(18px, env(safe-area-inset-left));
}

/* ── Page heading ── */
.dash-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.55));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;
  margin-bottom: 20px;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }

/* ── Bento grid ── */
.bento {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 168px;
  gap: 14px;
  grid-auto-flow: dense;
}

/* ── Tile base ── */
.tile {
  display: flex;
  flex-direction: column;
  padding: 16px 18px;
  border-radius: 18px;
  background:
    radial-gradient(ellipse 80% 70% at 80% 10%, color-mix(in srgb, var(--accent) 18%, transparent), transparent 65%),
    rgba(255,255,255,0.035);
  border: 1px solid color-mix(in srgb, var(--accent) 18%, rgba(255,255,255,0.06));
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: var(--glass-shadow);
  position: relative;
  text-decoration: none;
  color: inherit;
  transition: transform 0.22s var(--ease-spring), border-color 0.22s ease, box-shadow 0.22s ease;
  -webkit-tap-highlight-color: transparent;
}

.tile::before {
  content: '';
  position: absolute;
  top: 0; left: 14px; right: 14px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
  pointer-events: none;
  border-radius: 1px;
}

.tile:hover {
  transform: translateY(-3px);
  border-color: color-mix(in srgb, var(--accent) 55%, transparent);
  box-shadow: var(--glass-shadow), 0 0 32px color-mix(in srgb, var(--accent) 14%, transparent);
}

.tile:hover .tile-arrow { transform: translateX(4px); }
.tile:active { transform: translateY(-1px); }

/* ── Size variants ── */
.tile.big  { grid-column: span 2; grid-row: span 2; }
.tile.wide { grid-column: span 2; }

/* ── Tile inner elements ── */
.tile-num {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--text-tertiary);
}

.tile-emoji {
  position: absolute;
  top: 14px; right: 16px;
  font-size: 26px;
  filter: drop-shadow(0 0 10px var(--accent));
  line-height: 1;
}

.tile.big .tile-emoji { font-size: 38px; top: 18px; right: 20px; }

.tile-spacer { flex: 1; }

.tile-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 5px;
  letter-spacing: -0.01em;
}

.tile.big .tile-title { font-size: 22px; margin-bottom: 7px; }

.tile-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.tile-sub {
  font-size: 11.5px;
  color: var(--text-tertiary);
  line-height: 1.3;
}

.tile-arrow {
  font-size: 15px;
  color: var(--accent);
  transition: transform 0.22s var(--ease-spring);
  flex-shrink: 0;
}

/* ── Responsive ── */
@media (max-width: 720px) {
  .bento { grid-template-columns: repeat(2, 1fr); }
  .tile.big { grid-row: span 1; }
}

@media (max-width: 440px) {
  .bento { grid-template-columns: 1fr; gap: 10px; }
  .tile.big, .tile.wide { grid-column: span 1; grid-row: span 1; }
}

/* ── Page header row ── */
.page-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 20px;
}
.page-header .dash-title { margin-bottom: 0; }

/* ── Gear button ── */
.gear-btn {
  width: 42px; height: 42px; border-radius: 12px; flex-shrink: 0;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  color: var(--text-tertiary); cursor: pointer; display: flex;
  align-items: center; justify-content: center;
  transition: background 0.15s, border-color 0.15s, color 0.15s;
  -webkit-tap-highlight-color: transparent;
}
.gear-btn:hover { background: rgba(255,255,255,0.08); color: var(--text-secondary); border-color: rgba(255,255,255,0.14); }
.gear-btn:active { transform: rotate(22deg) scale(0.92); transition: transform 0.12s var(--ease-spring), background 0.15s; }

/* ── Modal backdrop ── */
.modal-bg {
  position: fixed; inset: 0; z-index: 200;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  opacity: 0; pointer-events: none;
  transition: opacity 0.22s ease;
}
.modal-bg.show { opacity: 1; pointer-events: all; }

/* ── Modal panel ── */
.modal {
  width: 100%; max-width: 420px; max-height: 88vh; overflow-y: auto;
  background: #111113;
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 20px;
  box-shadow: 0 32px 80px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.07);
  transform: translateY(12px) scale(0.98);
  transition: transform 0.26s var(--ease-spring);
  overscroll-behavior: contain;
}
.modal-bg.show .modal { transform: translateY(0) scale(1); }

.modal-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 18px 20px 0;
  position: sticky; top: 0; background: #111113; z-index: 1;
  padding-bottom: 14px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
}
.modal-title {
  font-size: 16px; font-weight: 700; color: var(--text-primary);
  letter-spacing: -0.01em;
}
.modal-close {
  width: 30px; height: 30px; border-radius: 8px;
  background: rgba(255,255,255,0.06); border: none;
  color: var(--text-tertiary); font-size: 18px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.15s;
}
.modal-close:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }

.modal-body { padding: 18px 20px 24px; display: flex; flex-direction: column; gap: 16px; }

/* ── Form fields ── */
.field-group { display: flex; flex-direction: column; gap: 7px; }
.field-label {
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-tertiary);
  font-family: var(--font-mono);
}
.field-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.field-input {
  flex: 1; min-width: 60px;
  background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
  border-radius: 10px; padding: 9px 12px;
  color: var(--text-primary); font-size: 15px; font-family: var(--font);
  outline: none; -webkit-appearance: none; appearance: none;
  transition: border-color 0.15s;
}
.field-input:focus { border-color: rgba(255,255,255,0.22); }
.field-input::placeholder { color: var(--text-tertiary); }
.ftin-sep { font-size: 12px; color: var(--text-tertiary); font-weight: 600; flex-shrink: 0; }

/* ── Segmented toggle ── */
.seg-toggle {
  display: flex; background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08); border-radius: 9px;
  padding: 3px; gap: 2px; flex-shrink: 0;
}
.seg-toggle.full-width { width: 100%; }
.seg-btn {
  flex: 1; padding: 6px 14px; border-radius: 6px; border: none;
  background: transparent; color: var(--text-tertiary);
  font-size: 13px; font-weight: 600; font-family: var(--font);
  cursor: pointer; transition: background 0.15s, color 0.15s;
  white-space: nowrap;
}
.seg-btn.active {
  background: rgba(255,255,255,0.12); color: var(--text-primary);
}

/* ── Save button ── */
.save-btn {
  width: 100%; padding: 12px; border-radius: 12px; border: none;
  background: rgba(255,255,255,0.1); color: var(--text-primary);
  font-size: 14px; font-weight: 700; font-family: var(--font);
  cursor: pointer; transition: background 0.15s, opacity 0.15s;
  margin-top: 4px;
}
.save-btn:hover { background: rgba(255,255,255,0.15); }
.save-btn:active { opacity: 0.8; }
.save-btn.saved { background: rgba(107,227,164,0.18); color: #6BE3A4; }

/* ── Modal divider ── */
.modal-divider {
  height: 1px; background: rgba(255,255,255,0.07); margin: 4px 0;
}

/* ── Greeting ── */
.greeting-section {
  margin-bottom: 24px;
}
.greeting-text {
  font-size: 21px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  margin-bottom: 7px;
}
.quote-wrap {
  display: flex;
  gap: 10px;
  align-items: flex-start;
  max-width: 600px;
}
.quote-bar {
  width: 3px;
  min-height: 100%;
  align-self: stretch;
  border-radius: 2px;
  background: linear-gradient(180deg, rgba(255,255,255,0.18), rgba(255,255,255,0.04));
  flex-shrink: 0;
  margin-top: 1px;
}
.quote-body { display: flex; flex-direction: column; gap: 3px; }
.quote-text {
  font-size: 13.5px;
  color: var(--text-secondary);
  font-style: italic;
  line-height: 1.55;
}
.quote-author {
  font-size: 11px;
  color: var(--text-tertiary);
  font-family: var(--font-mono);
  letter-spacing: 0.07em;
}

/* ── WHOOP card ── */
.whoop-header { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.whoop-status { display: flex; align-items: center; gap: 8px; }
.whoop-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: rgba(255,255,255,0.25); flex-shrink: 0;
}
.whoop-dot.connected {
  background: #6BE3A4;
  box-shadow: 0 0 6px rgba(107,227,164,0.6);
}
.whoop-label { font-size: 14px; font-weight: 600; color: var(--text-primary); }
.whoop-sync-age { font-size: 12px; color: var(--text-tertiary); padding-left: 16px; }
.whoop-stats {
  display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 14px;
}
.whoop-stat {
  background: rgba(255,255,255,0.04); border-radius: 10px;
  padding: 10px 8px; text-align: center; display: flex; flex-direction: column; gap: 4px;
}
.whoop-stat-val { font-size: 18px; font-weight: 700; color: var(--text-primary); }
.whoop-stat-key { font-size: 10px; font-weight: 600; color: var(--text-tertiary); text-transform: uppercase; letter-spacing: 0.06em; }
.whoop-sync-btn {
  width: 100%; padding: 10px; border-radius: 10px;
  background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.1);
  color: var(--text-secondary); font-size: 13px; font-weight: 600; font-family: var(--font);
  cursor: pointer; text-align: center; text-decoration: none; display: block;
  transition: background 0.15s;
}
.whoop-sync-btn:hover { background: rgba(255,255,255,0.12); color: var(--text-primary); }
.whoop-sync-btn:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>
<div class="page">
  <div class="page-header">
    <h1 class="dash-title">Dashboard</h1>
    <button class="gear-btn" id="gearBtn" aria-label="Settings">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/>
      </svg>
    </button>
  </div>

  <div class="greeting-section" id="greetingSection">
    <div class="greeting-text" id="greetingText"></div>
    <div class="quote-wrap">
      <div class="quote-bar"></div>
      <div class="quote-body">
        <div class="quote-text" id="quoteText"></div>
        <div class="quote-author" id="quoteAuthor"></div>
      </div>
    </div>
  </div>

  <div class="bento">

    <a href="main.html" class="tile big" style="--accent:#6BE3A4">
      <span class="tile-num">·01</span>

      <div class="tile-spacer"></div>
      <div class="tile-title">Main</div>

        <span class="tile-sub">Goals &amp; daily plan</span>
        <span class="tile-arrow">→</span>
      </div>

    <a href="gym.html" class="tile wide" style="--accent:#7DD3FC">
      <span class="tile-num">·02</span>
      <span class="tile-emoji">💪</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Fitness</div>
      <div class="tile-footer">
        <span class="tile-sub">Workouts, splits, sessions</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <a href="health.html" class="tile" style="--accent:#A7F3D0">
      <span class="tile-num">·03</span>
      <span class="tile-emoji">💊</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Health</div>
      <div class="tile-footer">
        <span class="tile-sub">Supplements &amp; vitals</span>

      </div>

    <a href="po-water.html" class="tile" style="--accent:#60A5FA">
      <span class="tile-num">·04</span>
      <span class="tile-emoji">💧</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Water</div>
      <div class="tile-footer">
        <span class="tile-sub">Hydration</span>
        <span class="tile-arrow">→</span>
      </div>

    <a href="finance.html" class="tile wide" style="--accent:#F2C063">
      <span class="tile-num">·05</span>

      <div class="tile-footer">
        <span class="tile-sub">Net worth &amp; spending</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <a href="focus.html" class="tile wide" style="--accent:#A78BFA">
      <span class="tile-num">·06</span>
      <span class="tile-emoji">🎯</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Focus</div>
      <div class="tile-footer">
        <span class="tile-sub">Timers &amp; sessions</span>
        <span class="tile-arrow">→</span>
      </div>

  </div>
</div>

<!-- ── Settings modal ── -->
<div class="modal-bg" id="settingsModalBg" role="presentation">
  <div class="modal" id="settingsModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">Your Data</span>
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
    </div>
    <div class="modal-body">

      <!-- Name -->
      <div class="field-group">
        <span class="field-label">Name</span>
        <input type="text" class="field-input" id="nameInput" placeholder="Michal" maxlength="32">
      </div>

      <!-- Height -->
      <div class="field-group">
        <span class="field-label">Height</span>
        <div class="field-row">
          <div id="heightInputs" style="display:flex;align-items:center;gap:6px;flex:1"></div>
          <div class="seg-toggle" id="heightUnitSeg">
            <button class="seg-btn active" data-val="cm">cm</button>
            <button class="seg-btn" data-val="ftin">ft / in</button>
          </div>
        </div>
      </div>

      <!-- Weight -->
      <div class="field-group">
        <span class="field-label">Weight</span>
        <div class="field-row">
          <input type="number" class="field-input" id="weightInput" placeholder="70" min="0" step="0.1">
          <div class="seg-toggle" id="weightUnitSeg">
            <button class="seg-btn active" data-val="kg">kg</button>
            <button class="seg-btn" data-val="lb">lb</button>
          </div>
        </div>
      </div>

      <!-- Age -->
      <div class="field-group">
        <span class="field-label">Age</span>
        <input type="number" class="field-input" id="ageInput" placeholder="25" min="0" max="120">
      </div>

      <!-- Sex -->
      <div class="field-group">
        <span class="field-label">Sex</span>
        <div class="seg-toggle full-width" id="sexSeg">
          <button class="seg-btn active" data-val="m">Male</button>
          <button class="seg-btn" data-val="f">Female</button>
        </div>
      </div>

      <!-- Active hours -->
      <div class="field-group">
        <span class="field-label">Active hours / week</span>
        <input type="number" class="field-input" id="activityInput" placeholder="5" min="0" max="168" step="0.5">
      </div>

      <button class="save-btn" id="saveBtn">Save</button>

      <!-- WHOOP -->
      <div class="modal-divider"></div>
      <div id="whoopCard"></div>

    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const LS_WATER      = 'po_water_v1';
  const LS_WHOOP      = 'whoop_tokens_v1';
  const LS_WHOOP_SYNC = 'whoop_last_sync';
  const LS_WHOOP_DATA = 'whoop_data_v1';

  let heightUnit = 'cm';
  let weightUnit = 'kg';

  /* ── storage ── */
  function loadWater() {
    try { return JSON.parse(localStorage.getItem(LS_WATER) || '{}'); } catch { return {}; }
  }
  function saveWaterMerge(patch) {
    const s = loadWater();
    const out = Object.assign({}, s, patch);
    out.logs       = s.logs       || {};
    out.substances = Array.isArray(s.substances) ? s.substances : [];
    localStorage.setItem(LS_WATER, JSON.stringify(out));
    try { if (window.__syncKey) window.__syncKey(LS_WATER, JSON.stringify(out)); } catch {}
  }
  function getProfile() {
    const s = loadWater();
    return Object.assign({ weightKg: 75, age: 25, sex: 'm', activityHrsPerWeek: 5, heightCm: 170 }, s.profile || {});
  }

  /* ── open / close ── */
  const bg = document.getElementById('settingsModalBg');

  function openModal() {
    populate();
    renderWhoop();
    syncWhoopAuto();
    bg.classList.add('show');
    document.body.style.overflow = 'hidden';
  }
  function closeModal() {
    bg.classList.remove('show');
    document.body.style.overflow = '';
  }

  document.getElementById('gearBtn').addEventListener('click', openModal);
  document.getElementById('modalClose').addEventListener('click', closeModal);
  bg.addEventListener('click', e => { if (e.target === bg) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && bg.classList.contains('show')) closeModal(); });

  /* ── populate ── */
  function populate() {
    const s = loadWater();
    const p = getProfile();

    document.getElementById('nameInput').value = p.name || '';

    weightUnit = s.weightUnit || 'kg';
    heightUnit = p.heightUnit || 'cm';

    const wDisp = weightUnit === 'lb' ? +(p.weightKg * 2.20462).toFixed(1) : +(p.weightKg || 0).toFixed(1);
    document.getElementById('weightInput').value = wDisp || '';
    segSet('weightUnitSeg', weightUnit);

    segSet('heightUnitSeg', heightUnit);
    renderHeightInputs(p.heightCm || 170);

    document.getElementById('ageInput').value      = p.age || '';
    document.getElementById('activityInput').value = p.activityHrsPerWeek || '';
    segSet('sexSeg', p.sex || 'm');
  }

  function renderHeightInputs(heightCm) {
    const c = document.getElementById('heightInputs');
    if (heightUnit === 'cm') {
      c.innerHTML = `<input type="number" class="field-input" id="heightCm" placeholder="170" min="0" value="${+(heightCm || 0).toFixed(0)}">`;
    } else {
      const totalIn = (heightCm || 0) / 2.54;
      const ft = Math.floor(totalIn / 12);
      const inch = Math.round(totalIn % 12);
      c.innerHTML = `<input type="number" class="field-input" id="heightFt" placeholder="5" min="0" style="width:72px" value="${ft || ''}"><span class="ftin-sep">ft</span><input type="number" class="field-input" id="heightIn" placeholder="10" min="0" max="11" style="width:72px" value="${inch || ''}"><span class="ftin-sep">in</span>`;
    }
  }

  function readHeightCm() {
    if (heightUnit === 'cm') return parseFloat(document.getElementById('heightCm')?.value) || 0;
    const ft   = parseFloat(document.getElementById('heightFt')?.value) || 0;
    const inch = parseFloat(document.getElementById('heightIn')?.value) || 0;
    return ft * 30.48 + inch * 2.54;
  }
  function readWeightKg() {
    const v = parseFloat(document.getElementById('weightInput')?.value) || 0;
    return weightUnit === 'lb' ? v / 2.20462 : v;
  }

  /* ── seg helpers ── */
  function segSet(id, val) {
    document.querySelectorAll(`#${id} .seg-btn`).forEach(b => b.classList.toggle('active', b.dataset.val === val));
  }
  function segActive(id) {
    return document.querySelector(`#${id} .seg-btn.active`)?.dataset.val || null;
  }

  /* ── seg wiring ── */
  document.getElementById('heightUnitSeg').addEventListener('click', e => {
    const b = e.target.closest('.seg-btn'); if (!b) return;
    const cur = readHeightCm();
    heightUnit = b.dataset.val;
    segSet('heightUnitSeg', heightUnit);
    renderHeightInputs(cur);
  });

  document.getElementById('weightUnitSeg').addEventListener('click', e => {
    const b = e.target.closest('.seg-btn'); if (!b) return;
    const cur = parseFloat(document.getElementById('weightInput').value) || 0;
    const next = b.dataset.val;
    let disp = cur;
    if (weightUnit === 'kg' && next === 'lb') disp = +(cur * 2.20462).toFixed(1);
    if (weightUnit === 'lb' && next === 'kg') disp = +(cur / 2.20462).toFixed(1);
    weightUnit = next;
    segSet('weightUnitSeg', weightUnit);
    document.getElementById('weightInput').value = disp || '';
  });

  document.getElementById('sexSeg').addEventListener('click', e => {
    const b = e.target.closest('.seg-btn'); if (!b) return;
    segSet('sexSeg', b.dataset.val);
  });

  /* ── save ── */
  document.getElementById('saveBtn').addEventListener('click', () => {
    const s = loadWater();
    saveWaterMerge({
      weightUnit,
      profile: Object.assign({}, s.profile || {}, {
        name:              document.getElementById('nameInput').value.trim() || '',
        weightKg:          +readWeightKg().toFixed(2),
        heightCm:          +readHeightCm().toFixed(1),
        heightUnit,
        age:               parseInt(document.getElementById('ageInput').value) || 0,
        sex:               segActive('sexSeg') || 'm',
        activityHrsPerWeek: parseFloat(document.getElementById('activityInput').value) || 0,
      })
    });
    renderGreeting();
    const btn = document.getElementById('saveBtn');
    btn.textContent = 'Saved ✓';
    btn.classList.add('saved');
    setTimeout(() => { btn.textContent = 'Save'; btn.classList.remove('saved'); }, 1800);
  });

  /* ── WHOOP ── */
  function whoopTokens() {
    try { return JSON.parse(localStorage.getItem(LS_WHOOP) || 'null'); } catch { return null; }
  }
  function whoopData() {
    try { return JSON.parse(localStorage.getItem(LS_WHOOP_DATA) || 'null'); } catch { return null; }
  }

  function renderWhoop() {
    const card   = document.getElementById('whoopCard');
    const tokens = whoopTokens();
    const data   = whoopData();
    const lastSync = localStorage.getItem(LS_WHOOP_SYNC);

    const connected = !!(tokens && tokens.access_token);

    let syncAge = '—';
    if (lastSync) {
      const mins = Math.round((Date.now() - parseInt(lastSync)) / 60000);
      syncAge = mins < 1 ? 'just now' : `${mins} min ago`;
    }

    if (connected) {
      const rec   = data?.recovery != null ? data.recovery + '%' : '—';
      const sleep = data?.sleep    != null ? data.sleep    + '%' : '—';
      const hr    = data?.restHr   != null ? data.restHr        : '—';
      card.innerHTML = `
        <div class="whoop-header">
          <div class="whoop-status">
            <span class="whoop-dot connected"></span>
            <span class="whoop-label">WHOOP Connected</span>
          </div>
          <span class="whoop-sync-age">Last synced ${syncAge}</span>
        </div>
        <div class="whoop-stats">
          <div class="whoop-stat"><span class="whoop-stat-val">${rec}</span><span class="whoop-stat-key">Recovery</span></div>
          <div class="whoop-stat"><span class="whoop-stat-val">${sleep}</span><span class="whoop-stat-key">Sleep</span></div>
          <div class="whoop-stat"><span class="whoop-stat-val">${hr}</span><span class="whoop-stat-key">Rest HR</span></div>
        </div>
        <button class="whoop-sync-btn" id="whoopSyncBtn">Sync now</button>`;
      document.getElementById('whoopSyncBtn').addEventListener('click', () => doSync(tokens));
    } else {
      card.innerHTML = `
        <div class="whoop-header">
          <div class="whoop-status">
            <span class="whoop-dot"></span>
            <span class="whoop-label">WHOOP not connected</span>
          </div>
        </div>
        <a href="health.html" class="whoop-sync-btn">Connect on Health page</a>`;
    }
  }

  async function doSync(tokens) {
    const btn = document.getElementById('whoopSyncBtn');
    if (btn) { btn.textContent = 'Syncing…'; btn.disabled = true; }
    try {
      let res = await fetch('/api/whoop-data', { headers: { Authorization: `Bearer ${tokens.access_token}` } });
      if (res.status === 401) {
        const rr = await fetch('/api/whoop-refresh', {
          method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ refresh_token: tokens.refresh_token })
        });
        if (!rr.ok) throw new Error('refresh failed');
        tokens = await rr.json();
        localStorage.setItem(LS_WHOOP, JSON.stringify(tokens));
        res = await fetch('/api/whoop-data', { headers: { Authorization: `Bearer ${tokens.access_token}` } });
      }
      if (!res.ok) throw new Error('whoop fetch failed');
      const j = await res.json();
      const out = {
        recovery: j.recovery?.score?.recovery_score   ?? j.recovery ?? null,
        sleep:    j.sleep?.score?.sleep_performance_percentage ?? j.sleep ?? null,
        restHr:   j.hr_resting ?? j.restHr ?? null,
      };
      localStorage.setItem(LS_WHOOP_DATA, JSON.stringify(out));
      localStorage.setItem(LS_WHOOP_SYNC, Date.now().toString());
    } catch { if (btn) { btn.textContent = 'Sync failed'; btn.disabled = false; return; } }
    renderWhoop();
  }

  function syncWhoopAuto() {
    const t = whoopTokens();
    if (t?.access_token) doSync(t);
  }

  /* ── Greeting + quote ── */
  const QUOTES = [
    { text: "The secret of getting ahead is getting started.", author: "Mark Twain" },
    { text: "It always seems impossible until it's done.", author: "Nelson Mandela" },
    { text: "Don't watch the clock; do what it does. Keep going.", author: "Sam Levenson" },
    { text: "Success is not final, failure is not fatal: it is the courage to continue that counts.", author: "Winston Churchill" },
    { text: "Believe you can and you're halfway there.", author: "Theodore Roosevelt" },
    { text: "The only way to do great work is to love what you do.", author: "Steve Jobs" },
    { text: "In the middle of every difficulty lies opportunity.", author: "Albert Einstein" },
    { text: "It does not matter how slowly you go as long as you do not stop.", author: "Confucius" },
    { text: "You miss 100% of the shots you don't take.", author: "Wayne Gretzky" },
    { text: "Whether you think you can or you think you can't, you're right.", author: "Henry Ford" },
    { text: "The harder I work, the luckier I get.", author: "Samuel Goldwyn" },
    { text: "Discipline is the bridge between goals and accomplishment.", author: "Jim Rohn" },
    { text: "Energy and persistence conquer all things.", author: "Benjamin Franklin" },
    { text: "Do what you can, with what you have, where you are.", author: "Theodore Roosevelt" },
    { text: "Small steps every day lead to big results.", author: "Anonymous" },
    { text: "The body achieves what the mind believes.", author: "Anonymous" },
    { text: "Strength does not come from the body. It comes from the will of the soul.", author: "Mahatma Gandhi" },
    { text: "Excellence is not a destination but a continuous journey.", author: "Brian Tracy" },
    { text: "What lies behind us and what lies before us are tiny matters compared to what lies within us.", author: "Ralph Waldo Emerson" },
    { text: "Take care of your body. It's the only place you have to live.", author: "Jim Rohn" },
    { text: "Act as if what you do makes a difference. It does.", author: "William James" },
    { text: "Motivation gets you started. Habit keeps you going.", author: "Jim Ryun" },
    { text: "Hard choices, easy life. Easy choices, hard life.", author: "Jerzy Gregorek" },
    { text: "The pain you feel today will be the strength you feel tomorrow.", author: "Arnold Schwarzenegger" },
    { text: "Your future is created by what you do today, not tomorrow.", author: "Robert Kiyosaki" },
    { text: "Success usually comes to those who are too busy to be looking for it.", author: "Henry David Thoreau" },
    { text: "Don't limit your challenges. Challenge your limits.", author: "Jerry Dunn" },
    { text: "Push yourself, because no one else is going to do it for you.", author: "Anonymous" },
    { text: "Great things never came from comfort zones.", author: "Anonymous" },
    { text: "Dream big. Work hard. Stay focused.", author: "Anonymous" },
    { text: "Progress, not perfection.", author: "Anonymous" },
    { text: "One day or day one — you decide.", author: "Anonymous" },
  ];

  function renderGreeting() {
    const hour = new Date().getHours();
    const salutation = hour < 12 ? 'Good morning' : hour < 17 ? 'Good afternoon' : 'Good evening';
    const p = getProfile();
    const name = p.name || '';
    document.getElementById('greetingText').textContent = name ? `${salutation}, ${name}` : salutation;

    const now = new Date();
    const start = new Date(now.getFullYear(), 0, 0);
    const dayOfYear = Math.floor((now - start) / 86400000);
    const q = QUOTES[dayOfYear % QUOTES.length];
    document.getElementById('quoteText').textContent = `"${q.text}"`;
    document.getElementById('quoteAuthor').textContent = `— ${q.author}`;
  }

  renderGreeting();

})();
</script>
