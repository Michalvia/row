<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="lock.js" defer></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg: #0A0A0B;
  --bg-deep: #050506;
  --bg-card: rgba(255,255,255,0.04);
  --border-soft: rgba(255,255,255,0.05);
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --glass-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 12px 40px rgba(0,0,0,0.45), 0 1px 2px rgba(0,0,0,0.25);
  --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
  color-scheme: dark;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--bg-deep);
  color: var(--text-primary);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  min-height: 100%;
}

body::before {
  content: ''; position: fixed; inset: -10%; z-index: -2;
  background:
    radial-gradient(60% 45% at 82% 14%, rgba(224,118,88,0.16) 0%, transparent 55%),
    radial-gradient(55% 45% at 18% 90%, rgba(180,180,200,0.06) 0%, transparent 55%),
    linear-gradient(180deg, #0A0A0B 0%, #050506 100%);
  filter: blur(40px) saturate(1.05);
  pointer-events: none;
  animation: drift 36s ease-in-out infinite alternate;
}

body::after {
  content: ''; position: fixed; inset: 0; z-index: -1;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  opacity: 0.7; pointer-events: none;
}

@keyframes drift {
  0%   { transform: translate(0, 0); }
  100% { transform: translate(-2%, 2%); }
}

.page {
  max-width: 980px;
  margin: 0 auto;
  padding: 20px max(18px, env(safe-area-inset-right)) 100px max(18px, env(safe-area-inset-left));
}

/* ── Page heading ── */
.dash-title {
  font-size: 28px;
  font-weight: 700;
  letter-spacing: -0.02em;
  background: linear-gradient(135deg, #fff 30%, rgba(255,255,255,0.55));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  color: transparent;
  margin-bottom: 20px;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }

/* ── Bento grid ── */
.bento {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  grid-auto-rows: 168px;
  gap: 14px;
  grid-auto-flow: dense;
}

/* ── Tile base ── */
.tile {
  display: flex;
  flex-direction: column;
  padding: 16px 18px;
  border-radius: 18px;
  background: var(--bg-card);
  border: 1px solid var(--border-soft);
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: var(--glass-shadow);
  position: relative;
  text-decoration: none;
  color: inherit;
  transition: transform 0.22s var(--ease-spring), border-color 0.22s ease, box-shadow 0.22s ease;
  -webkit-tap-highlight-color: transparent;
}

.tile::before {
  content: '';
  position: absolute;
  top: 0; left: 14px; right: 14px; height: 1px;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.14), transparent);
  pointer-events: none;
  border-radius: 1px;
}

.tile:hover {
  transform: translateY(-3px);
  border-color: color-mix(in srgb, var(--accent) 35%, transparent);
  box-shadow: var(--glass-shadow), 0 0 24px color-mix(in srgb, var(--accent) 8%, transparent);
}

.tile:hover .tile-arrow { transform: translateX(4px); }
.tile:active { transform: translateY(-1px); }

/* ── Size variants ── */
.tile.big  { grid-column: span 2; grid-row: span 2; }
.tile.wide { grid-column: span 2; }

/* ── Tile inner elements ── */
.tile-num {
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.14em;
  color: var(--text-tertiary);
}

.tile-emoji {
  position: absolute;
  top: 14px; right: 16px;
  font-size: 26px;
  filter: drop-shadow(0 0 10px var(--accent));
  line-height: 1;
}

.tile.big .tile-emoji { font-size: 38px; top: 18px; right: 20px; }

.tile-spacer { flex: 1; }

.tile-title {
  font-size: 16px;
  font-weight: 700;
  color: var(--text-primary);
  margin-bottom: 5px;
  letter-spacing: -0.01em;
}

.tile.big .tile-title { font-size: 22px; margin-bottom: 7px; }

.tile-footer {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.tile-sub {
  font-size: 11.5px;
  color: var(--text-tertiary);
  line-height: 1.3;
}

.tile-arrow {
  font-size: 15px;
  color: var(--accent);
  transition: transform 0.22s var(--ease-spring);
  flex-shrink: 0;
}

/* ── Responsive ── */
@media (max-width: 720px) {
  .bento { grid-template-columns: repeat(2, 1fr); }
  .tile.big { grid-row: span 1; }
}

@media (max-width: 440px) {
  .bento { grid-template-columns: 1fr; gap: 10px; }
  .tile.big, .tile.wide { grid-column: span 1; grid-row: span 1; }
}
</style>
</head>
<body>
<div class="page">
  <h1 class="dash-title">Dashboard</h1>

  <div class="bento">

    <a href="main.html" class="tile big" style="--accent:#6BE3A4">
      <span class="tile-num">·01</span>
      <span class="tile-emoji">🏠</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Main</div>
      <div class="tile-footer">
        <span class="tile-sub">Goals &amp; daily plan</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <a href="gym.html" class="tile wide" style="--accent:#7DD3FC">
      <span class="tile-num">·02</span>
      <span class="tile-emoji">💪</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Fitness</div>
      <div class="tile-footer">
        <span class="tile-sub">Workouts, splits, sessions</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <a href="health.html" class="tile" style="--accent:#A7F3D0">
      <span class="tile-num">·03</span>
      <span class="tile-emoji">💊</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Health</div>
      <div class="tile-footer">
        <span class="tile-sub">Supplements &amp; vitals</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <a href="po-water.html" class="tile" style="--accent:#60A5FA">
      <span class="tile-num">·04</span>
      <span class="tile-emoji">💧</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Water</div>
      <div class="tile-footer">
        <span class="tile-sub">Hydration</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <a href="finance.html" class="tile wide" style="--accent:#F2C063">
      <span class="tile-num">·05</span>
      <span class="tile-emoji">📊</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Finance</div>
      <div class="tile-footer">
        <span class="tile-sub">Net worth &amp; spending</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

    <a href="focus.html" class="tile wide" style="--accent:#A78BFA">
      <span class="tile-num">·06</span>
      <span class="tile-emoji">🎯</span>
      <div class="tile-spacer"></div>
      <div class="tile-title">Focus</div>
      <div class="tile-footer">
        <span class="tile-sub">Timers &amp; sessions</span>
        <span class="tile-arrow">→</span>
      </div>
    </a>

  </div>
</div>
</body>
</html>
