<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<title>Focus — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg: #050506;
  --bg-card: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.12);
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --accent: #6BE3A4;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --ease-spring: cubic-bezier(0.22, 1, 0.36, 1);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg); color: var(--text-secondary);
  font-family: var(--font); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}
body { min-height: 100vh; position: relative; overflow-x: hidden; }
body::before {
  content: ''; position: fixed; inset: 0;
  background:
    radial-gradient(60% 50% at 82% 14%, rgba(224,118,88,0.16) 0%, transparent 60%),
    radial-gradient(50% 40% at 18% 90%, rgba(180,180,200,0.06) 0%, transparent 60%);
  filter: blur(40px);
  pointer-events: none; z-index: 0;
  animation: drift 36s ease-in-out infinite alternate;
}
body::after {
  content: ''; position: fixed; inset: 0;
  background-image: radial-gradient(rgba(255,255,255,0.014) 1px, transparent 1px);
  background-size: 3px 3px;
  pointer-events: none; z-index: 1;
}
@keyframes drift {
  0%   { transform: translate(0,0); }
  100% { transform: translate(-2%,2%); }
}
main {
  position: relative; z-index: 2;
  max-width: 480px; margin: 0 auto;
  padding: 16px max(18px, env(safe-area-inset-right)) 100px max(18px, env(safe-area-inset-left));
  display: flex; flex-direction: column; gap: 12px;
}

/* ── Cards ── */
.card {
  background: var(--bg-card);
  border-radius: 16px; padding: 20px;
  backdrop-filter: blur(24px) saturate(1.2);
  -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45);
}
.card-title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 14px;
}

/* ── Segmented control ── */
.seg {
  display: flex; gap: 3px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 3px;
}
.seg button {
  flex: 1; padding: 7px 0; background: none; border: none; border-radius: 8px;
  color: var(--text-tertiary); font-family: var(--font); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.18s var(--ease-spring);
  -webkit-tap-highlight-color: transparent;
}
.seg button.active {
  background: linear-gradient(180deg, #ffffff 0%, #e8e5dd 100%);
  color: #0a0a0b;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 2px 8px rgba(0,0,0,0.35);
}

/* ── Buttons ── */
.btn-primary {
  width: 100%; padding: 13px;
  background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%);
  color: #0A0A0B; border: none; border-radius: 12px;
  font-family: var(--font); font-size: 15px; font-weight: 700;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 2px 8px rgba(0,0,0,0.35), 0 8px 22px rgba(0,0,0,0.25);
  transition: opacity 0.15s, transform 0.15s var(--ease-spring);
}
.btn-primary:active { opacity: 0.88; transform: scale(0.98); }
.btn-ghost {
  padding: 10px 18px;
  background: rgba(255,255,255,0.04);
  border: 1px solid var(--border-strong);
  border-radius: 10px; color: var(--text-secondary);
  font-family: var(--font); font-size: 13px; font-weight: 600;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 0.15s;
}
.btn-ghost:active { background: rgba(255,255,255,0.08); }

/* ── Input ── */
.f-input {
  width: 100%; padding: 10px 12px; outline: none;
  background: rgba(0,0,0,0.28); border: 1px solid var(--border);
  border-radius: 10px; color: var(--text-primary);
  font-family: var(--font); font-size: 14px;
  transition: border-color 0.15s;
}
.f-input::placeholder { color: var(--text-tertiary); }
.f-input:focus { border-color: var(--border-strong); }

/* ── Category chips ── */
.cat-bar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.cat-chip {
  padding: 6px 14px; border-radius: 20px;
  border: 1px solid var(--border-strong);
  background: rgba(255,255,255,0.04);
  color: var(--text-tertiary);
  font-size: 13px; font-weight: 600;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: all 0.2s var(--ease-spring);
  position: relative; user-select: none; white-space: nowrap;
}
.cat-chip.active { color: #FAFAFA; }
.chip-x {
  position: absolute; top: -5px; right: -5px;
  width: 16px; height: 16px; border-radius: 50%;
  background: #FF6B6B; color: #fff;
  font-size: 10px; font-weight: 800; border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; line-height: 1; flex-shrink: 0;
}
.cat-chip-add {
  padding: 6px 12px; border-radius: 20px;
  border: 1px dashed var(--border-strong);
  background: none; color: var(--text-tertiary);
  font-size: 13px; cursor: pointer;
  -webkit-tap-highlight-color: transparent; transition: color 0.15s;
}
.cat-chip-add:hover { color: var(--text-secondary); }
.cat-edit-btn {
  width: 28px; height: 28px; border-radius: 50%; flex-shrink: 0;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  color: var(--text-tertiary); display: flex; align-items: center; justify-content: center;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: all 0.18s var(--ease-spring);
}
.cat-edit-btn:hover { background: rgba(255,255,255,0.07); color: var(--text-secondary); }
.cat-edit-btn.done {
  background: rgba(255,255,255,0.08); border-color: var(--border-strong); color: var(--text-primary);
}

/* ── Category sheet ── */
.cat-sheet {
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 14px; padding: 14px;
  display: flex; flex-direction: column; gap: 10px;
  overflow: hidden; max-height: 0; opacity: 0;
  transition: max-height 0.4s var(--ease-spring), opacity 0.3s, padding 0.3s, margin 0.3s;
}
.cat-sheet.open { max-height: 420px; opacity: 1; margin-top: 12px; }
.cat-sheet.closed { padding: 0; }

/* ── HSV picker ── */
.hsv-canvas-row { display: flex; gap: 8px; align-items: stretch; }
#hsvCanvas { border-radius: 8px; flex: 1; height: 120px; cursor: crosshair; touch-action: none; }
#hueSlider { width: 20px; border-radius: 6px; cursor: pointer; touch-action: none; }
.hsv-preview { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2); flex-shrink: 0; }
.palette-row { display: flex; gap: 7px; flex-wrap: wrap; }
.pal-swatch {
  width: 22px; height: 22px; border-radius: 50%;
  border: 2px solid transparent; cursor: pointer;
  transition: transform 0.12s, border-color 0.12s;
}
.pal-swatch:hover { transform: scale(1.15); }
.pal-swatch.sel { border-color: rgba(255,255,255,0.7); transform: scale(1.1); }

/* ── Context menu ── */
.ctx-menu {
  position: fixed; z-index: 9999;
  background: rgba(30,30,35,0.96); border: 1px solid var(--border-strong);
  border-radius: 14px; padding: 6px; backdrop-filter: blur(20px);
  min-width: 160px; box-shadow: 0 16px 48px rgba(0,0,0,0.6);
  animation: ctxIn 0.18s var(--ease-spring);
}
@keyframes ctxIn { from { opacity:0; transform:scale(0.88); } to { opacity:1; transform:scale(1); } }
.ctx-item {
  padding: 10px 14px; border-radius: 9px; font-size: 14px; font-weight: 500;
  cursor: pointer; color: var(--text-primary); transition: background 0.12s;
}
.ctx-item:hover { background: rgba(255,255,255,0.07); }
.ctx-item.danger { color: #FF6B6B; }

/* ── Preset grid ── */
.preset-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 18px;
}
.preset-card {
  padding: 10px 12px; border-radius: 12px; text-align: left;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: all 0.2s var(--ease-spring);
}
.preset-card.active {
  background: rgba(107,227,164,0.08);
  border-color: rgba(107,227,164,0.28);
}
.preset-name {
  display: block; font-size: 13px; font-weight: 700;
  color: var(--text-secondary); transition: color 0.2s;
}
.preset-card.active .preset-name { color: var(--accent); }
.preset-dur {
  display: block; font-size: 11px; color: var(--text-tertiary); margin-top: 2px;
}

/* ── Custom duration row ── */
.custom-dur-row {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  padding: 10px 12px; margin-bottom: 14px;
  background: rgba(0,0,0,0.2); border: 1px solid var(--border);
  border-radius: 10px;
}
.custom-dur-row label {
  display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: var(--text-tertiary); font-weight: 600;
}
.dur-input {
  width: 52px; padding: 6px 4px; text-align: center; outline: none;
  background: rgba(0,0,0,0.3); border: 1px solid var(--border-strong);
  border-radius: 8px; color: var(--text-primary);
  font-family: var(--font-mono); font-size: 16px; font-weight: 700;
  -moz-appearance: textfield;
}
.dur-input::-webkit-outer-spin-button,
.dur-input::-webkit-inner-spin-button { -webkit-appearance: none; }
.dur-sep { color: var(--text-tertiary); font-size: 16px; }

/* ── Ring timer ── */
.ring-outer {
  position: relative; width: 220px; height: 220px;
  margin: 0 auto 20px; flex-shrink: 0;
}
.ring-svg {
  width: 100%; height: 100%;
  transform: rotate(-90deg);
  overflow: visible;
}
.ring-track { fill: none; stroke: rgba(255,255,255,0.07); stroke-width: 10; }
.ring-progress {
  fill: none; stroke: var(--accent); stroke-width: 10;
  stroke-linecap: round;
  stroke-dasharray: 565.49;
  stroke-dashoffset: 0;
  transition: stroke-dashoffset 0.9s linear, stroke 0.4s;
}
@keyframes ringGlow {
  0%, 100% { filter: drop-shadow(0 0 6px rgba(107,227,164,0.5)); }
  50%       { filter: drop-shadow(0 0 18px rgba(107,227,164,0.9)); }
}
.ring-progress.glowing { animation: ringGlow 1s ease-in-out infinite; }

/* ── Ripple rings ── */
.ripple-ring {
  position: absolute; top: 50%; left: 50%;
  width: 150px; height: 150px;
  border-radius: 50%; border: 2px solid var(--accent);
  transform: translate(-50%, -50%);
  pointer-events: none; opacity: 0;
}
@keyframes rippleOut {
  0%   { width: 150px; height: 150px; opacity: 0.55; }
  100% { width: 260px; height: 260px; opacity: 0; }
}
.ripple-ring.active { animation: rippleOut 1.4s ease-out infinite; }
.ripple-ring.active:nth-child(2) { animation-delay: 0.45s; }
.ripple-ring.active:nth-child(3) { animation-delay: 0.90s; }

/* ── Ring center content ── */
.ring-center {
  position: absolute; inset: 0;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  pointer-events: none;
}
.ring-time {
  font-family: var(--font-mono); font-size: 46px; font-weight: 700;
  letter-spacing: -2px; color: var(--text-primary);
  font-variant-numeric: tabular-nums; line-height: 1;
  transition: opacity 0.3s;
}
.ring-phase {
  font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
  text-transform: uppercase; color: var(--text-tertiary);
  margin-top: 6px; transition: opacity 0.3s;
  display: flex; align-items: center; gap: 5px;
}
.pulse-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent); flex-shrink: 0;
  animation: ledPulse 1.6s ease-in-out infinite;
}
@keyframes ledPulse {
  0%,100% { opacity:1; transform:scale(1); }
  50%     { opacity:0.4; transform:scale(0.82); }
}

/* ── Checkmark ── */
.check-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  pointer-events: none; opacity: 0; transition: opacity 0.3s;
}
.check-overlay.show { opacity: 1; }
.check-path {
  fill: none; stroke: var(--accent); stroke-width: 5;
  stroke-linecap: round; stroke-linejoin: round;
}

/* ── Timer controls ── */
.timer-controls { display: flex; gap: 8px; justify-content: center; }
.t-btn {
  padding: 12px 28px; border-radius: 12px; border: none;
  font-family: var(--font); font-size: 14px; font-weight: 700;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: all 0.15s var(--ease-spring);
}
.t-btn-start {
  background: linear-gradient(180deg, #FFFFFF 0%, #E8E5DD 100%);
  color: #0A0A0B; flex: 1;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 2px 8px rgba(0,0,0,0.35), 0 8px 22px rgba(0,0,0,0.25);
}
.t-btn-start:active { transform: scale(0.97); opacity: 0.9; }
.t-btn-start:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }
.t-btn-reset {
  background: rgba(255,255,255,0.05); border: 1px solid var(--border-strong);
  color: var(--text-secondary);
}
.t-btn-reset:active { background: rgba(255,255,255,0.09); }
.t-btn-complete {
  width: 100%; margin-top: 8px; padding: 11px;
  background: rgba(107,227,164,0.08); border: 1px solid rgba(107,227,164,0.25);
  border-radius: 12px; color: var(--accent);
  font-family: var(--font); font-size: 13px; font-weight: 700;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  transition: background 0.15s;
}
.t-btn-complete:active { background: rgba(107,227,164,0.14); }
.start-hint {
  font-size: 12px; color: var(--text-tertiary); text-align: center;
  margin-top: 8px; display: none;
}

/* ── Today So Far ── */
.today-total {
  font-family: var(--font-mono); font-size: 32px; font-weight: 700;
  letter-spacing: -1px; color: var(--text-primary);
  margin-bottom: 14px;
}
.today-cat-row { margin-bottom: 12px; }
.today-cat-row:last-child { margin-bottom: 0; }
.today-bar-track {
  height: 4px; background: rgba(255,255,255,0.06);
  border-radius: 2px; overflow: hidden; margin-top: 5px;
}
.today-bar-fill {
  height: 100%; border-radius: 2px;
  transition: width 0.5s var(--ease-spring);
}

/* ── Analytics ── */
.line-graph-wrap { position: relative; width: 100%; height: 140px; margin-bottom: 6px; }
.line-graph-wrap svg { width: 100%; height: 100%; overflow: visible; }
.lg-xlabel { display: flex; justify-content: space-between; padding: 0 2px; margin-top: 2px; }
.lg-xlabel span { font-size: 10px; color: var(--text-tertiary); font-weight: 600; }
.donut-wrap { display: flex; align-items: center; gap: 20px; margin-top: 14px; }
.donut-legend { flex: 1; display: flex; flex-direction: column; gap: 7px; }
.legend-pill {
  display: flex; align-items: center; gap: 8px;
  padding: 7px 10px; border-radius: 10px;
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  cursor: pointer; transition: background 0.15s;
}
.legend-pill:hover { background: rgba(255,255,255,0.06); }
.legend-pill.highlight { background: rgba(255,255,255,0.07); border-color: var(--border-strong); }
.legend-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
.legend-name { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
.legend-pct { font-size: 12px; color: var(--text-tertiary); font-weight: 600; }

/* ── Past Sessions ── */
.sess-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.sess-icon-btn { width:28px; height:28px; border-radius:50%; border:none; background:rgba(255,255,255,0.07); color:var(--text-tertiary); cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.15s; flex-shrink:0; }
.sess-icon-btn:hover { background:rgba(255,255,255,0.13); }
.sess-icon-btn.on { background:rgba(255,255,255,0.14); color:var(--text-primary); }
.sess-icon-btn svg { width:14px; height:14px; pointer-events:none; }
.chevron-svg { transition:transform 0.38s cubic-bezier(0.22,1,0.36,1); display:block; }
.chevron-svg.flipped { transform:rotate(180deg); }
.sess-collapsible { overflow:hidden; max-height:3000px; opacity:1; transition:max-height 0.6s cubic-bezier(0.22,1,0.36,1), opacity 0.3s ease; }
.sess-collapsible.collapsed { max-height:0; opacity:0; }
.sess-list { display: flex; flex-direction: column; gap: 8px; }
.sess-item { display:flex; align-items:center; background:rgba(255,255,255,0.03); border:1px solid var(--border); border-radius:12px; overflow:hidden; cursor:pointer; transition:background 0.15s; }
.sess-item:hover { background:rgba(255,255,255,0.05); }
.sess-bar { width: 4px; align-self: stretch; flex-shrink: 0; }
.sess-body { flex: 1; padding: 10px 12px; }
.sess-cat { font-size: 13px; font-weight: 700; color: var(--text-primary); }
.sess-meta { font-size: 12px; color: var(--text-tertiary); margin-top: 1px; }
.sess-dur { font-family:var(--font-mono); font-size:13px; font-weight:700; color:var(--text-secondary); padding:10px 12px; }
.sess-del-btn { width:26px; height:26px; border-radius:50%; border:none; background:rgba(255,80,80,0.15); color:#FF6B6B; cursor:pointer; font-size:17px; font-weight:400; flex-shrink:0; margin-right:10px; display:flex; align-items:center; justify-content:center; transition:background 0.15s; line-height:1; }
.sess-del-btn:hover { background:rgba(255,80,80,0.3); }
.sess-empty { text-align:center; color:var(--text-tertiary); font-size:14px; padding:24px 0; }
/* ── Edit session overlay ── */
.edit-overlay { position:fixed; inset:0; z-index:9000; background:rgba(0,0,0,0.55); backdrop-filter:blur(6px); display:flex; align-items:flex-end; justify-content:center; opacity:0; pointer-events:none; transition:opacity 0.25s; }
.edit-overlay.open { opacity:1; pointer-events:all; }
.edit-sheet { width:100%; max-width:480px; background:#111115; border-radius:24px 24px 0 0; padding:0 0 max(24px,env(safe-area-inset-bottom)); transform:translateY(100%); transition:transform 0.38s var(--ease-spring); overflow-y:auto; max-height:92vh; }
.edit-overlay.open .edit-sheet { transform:translateY(0); }
.edit-inner { padding:0 18px; }
.edit-title-row { font-size:15px; font-weight:700; color:var(--text-primary); text-align:center; padding:6px 0 10px; }
/* ── iOS Calendar ── */
.cal-header { display:flex; align-items:center; justify-content:space-between; padding:4px 0 8px; }
.cal-nav { width:30px; height:30px; border:none; background:rgba(255,255,255,0.08); border-radius:50%; color:var(--text-primary); font-size:15px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background 0.15s; }
.cal-nav:hover { background:rgba(255,255,255,0.15); }
.cal-month-lbl { font-size:14px; font-weight:700; color:var(--text-primary); }
.cal-wds { display:grid; grid-template-columns:repeat(7,1fr); margin-bottom:2px; }
.cal-wd { font-size:10px; font-weight:600; color:var(--text-tertiary); text-align:center; padding:2px 0 4px; letter-spacing:0.03em; }
.cal-days { display:grid; grid-template-columns:repeat(7,1fr); grid-template-rows:repeat(6,auto); min-height:210px; align-content:start; }
.cal-day { height:33px; display:flex; align-items:center; justify-content:center; border-radius:50%; font-size:13px; font-weight:500; color:var(--text-primary); cursor:pointer; transition:background 0.12s; margin:1px 0; }
.cal-day:hover:not(.cal-disabled):not(.cal-sel) { background:rgba(255,255,255,0.08); }
.cal-day.cal-sel { background:#6BE3A4; color:#000; font-weight:700; }
.cal-day.cal-today:not(.cal-sel) { color:#6BE3A4; font-weight:700; }
.cal-day.cal-disabled { color:rgba(255,255,255,0.2); cursor:default; pointer-events:none; }
/* ── Edit time pickers ── */
.edit-time-wrap { display:flex; border:1px solid var(--border); border-radius:14px; overflow:hidden; margin:12px 0 6px; }
.edit-time-col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; padding:10px 0 8px; }
.edit-time-col+.edit-time-col { border-left:1px solid var(--border); }
.edit-time-lbl { font-size:10px; font-weight:700; color:var(--text-tertiary); letter-spacing:0.07em; text-transform:uppercase; }
.edit-drums { display:flex; align-items:center; gap:3px; }
.edit-sheet .drum-wrap { width:50px; }
.t-sep { font-size:18px; font-weight:700; color:var(--text-secondary); padding-bottom:2px; }
.ampm-stack { display:flex; flex-direction:column; gap:3px; margin-left:3px; }
.ampm-btn { padding:4px 6px; border:1px solid rgba(255,255,255,0.10); border-radius:7px; background:transparent; color:var(--text-tertiary); font-size:10px; font-weight:700; cursor:pointer; transition:all 0.15s; font-family:var(--font); letter-spacing:0.04em; }
.ampm-btn.active { background:rgba(255,255,255,0.14); color:var(--text-primary); border-color:rgba(255,255,255,0.22); }

/* ── Drum picker ── */
.drum-overlay {
  position: fixed; inset: 0; z-index: 8000;
  background: rgba(0,0,0,0.5); backdrop-filter: blur(6px);
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity 0.25s;
}
.drum-overlay.open { opacity: 1; pointer-events: all; }
.drum-sheet {
  width: 100%; max-width: 480px;
  background: #111115; border-radius: 24px 24px 0 0;
  padding: 0 0 max(20px, env(safe-area-inset-bottom));
  transform: translateY(100%);
  transition: transform 0.35s var(--ease-spring);
}
.drum-overlay.open .drum-sheet { transform: translateY(0); }
.drum-handle { width: 36px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); margin: 12px auto 8px; }
.drum-title { text-align: center; font-size: 13px; font-weight: 600; color: var(--text-tertiary); margin-bottom: 4px; }
.drum-row { display: flex; justify-content: center; }
.drum-col { display: flex; flex-direction: column; align-items: center; }
.drum-col-label { font-size: 10px; font-weight: 700; letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 4px; }
.drum-wrap {
  position: relative; overflow: hidden; width: 80px;
  user-select: none; -webkit-user-select: none; touch-action: none; cursor: ns-resize;
}
.drum-fade-t,.drum-fade-b { position: absolute; left:0; right:0; height:70px; pointer-events:none; z-index:2; }
.drum-fade-t { top:0; background:linear-gradient(#111115,transparent); }
.drum-fade-b { bottom:0; background:linear-gradient(transparent,#111115); }
.drum-sel-line { position:absolute; left:8px; right:8px; height:1px; background:rgba(255,255,255,0.10); pointer-events:none; z-index:3; }
.drum-sel-line.top { top:calc(50% - 19px); }
.drum-sel-line.bot { top:calc(50% + 19px); }
.drum-track { position:relative; transition:transform 0.28s var(--ease-spring); }
.drum-item {
  height:38px; display:flex; align-items:center; justify-content:center;
  font-family:var(--font-mono); font-size:20px; font-weight:600;
  color:var(--text-tertiary); transition:color 0.12s,font-size 0.12s; white-space:nowrap;
}
.drum-item.sel { color:var(--text-primary); font-size:22px; }
.drum-done-btn {
  display:block; margin:12px auto 0; padding:11px 40px;
  background:linear-gradient(180deg,#FFFFFF 0%,#E8E5DD 100%);
  color:#0A0A0B; border:none; border-radius:12px;
  font-family:var(--font); font-size:15px; font-weight:700; cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,0.9),0 2px 8px rgba(0,0,0,0.35);
}
/* ── Inline drum pickers ── */
.picker-row { display:flex; justify-content:center; gap:16px; }
.drum-unit { font-size:11px; font-weight:700; color:var(--text-tertiary); margin-top:5px; letter-spacing:0.06em; text-transform:uppercase; }
.drum-sep-lg { font-size:24px; font-weight:600; color:var(--text-tertiary); display:flex; align-items:center; padding-bottom:4px; }
/* ── Timer picker / preset slide animation ── */
.timer-dur-picker { overflow:hidden; max-height:280px; opacity:1; margin-bottom:18px; transition:max-height 0.5s cubic-bezier(0.22,1,0.36,1), opacity 0.35s ease, margin-bottom 0.5s cubic-bezier(0.22,1,0.36,1); }
.timer-dur-picker.picker-hidden { max-height:0; opacity:0; pointer-events:none; margin-bottom:0; }
.hide-on-run { overflow:hidden; max-height:400px; opacity:1; transition:max-height 0.5s cubic-bezier(0.22,1,0.36,1), opacity 0.35s ease; }
.hide-on-run.picker-hidden { max-height:0; opacity:0; pointer-events:none; }
/* ── Time format toggle ── */
.time-fmt-btn { background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.10); border-radius:6px; color:var(--text-tertiary); font-size:10px; font-weight:700; font-family:var(--font-mono); padding:2px 7px; cursor:pointer; letter-spacing:0.05em; transition:background 0.15s; margin:3px 0 5px; }
.time-fmt-btn:hover { background:rgba(255,255,255,0.14); }
/* ── Legend subtitle ── */
.legend-name-col { display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
.legend-subtime { font-size:10px; color:var(--text-tertiary); font-weight:500; line-height:1.3; }
</style>
</head>
<body>
<main>

<!-- ── 1. Category ── -->
<div class="card">
  <div class="card-title">Category</div>
  <div class="cat-bar" id="catBar"></div>
  <div class="cat-sheet closed" id="catSheet">
    <input class="f-input" id="catNameInput" placeholder="Category name" maxlength="24">
    <div style="display:flex;flex-direction:column;gap:8px">

<!-- ── 2. Timer ── -->

  <!-- Pomodoro presets (hidden in other modes) -->

        <div class="drum-col">

          <div class="drum-wrap" id="cbPicker">

  <!-- Timer mode duration (hidden in other modes, animates out on start) -->

    <div class="picker-row">

        <div class="drum-wrap" id="timerHrPicker">

          <div class="drum-sel-line top"></div><div class="drum-sel-line bot"></div>
        </div>
        <div class="drum-unit">hr</div>
      </div>
      <div class="drum-sep-lg">:</div>
      <div class="drum-col">
        <div class="drum-wrap" id="timerHrMinPicker">
          <div class="drum-fade-t"></div><div class="drum-fade-b"></div>
          <div class="drum-sel-line top"></div><div class="drum-sel-line bot"></div>
        </div>
        <div class="drum-unit">min</div>
      </div>

  </div>

  <!-- SVG Ring -->
  <div class="ring-outer">
    <svg class="ring-svg" viewBox="0 0 220 220">
      <circle class="ring-track" cx="110" cy="110" r="90"/>

  <!-- Controls -->

<!-- Edit session overlay -->

            <span class="t-sep">:</span>
            <div class="drum-wrap" id="editEndMin"><div class="drum-fade-t"></div><div class="drum-fade-b"></div><div class="drum-sel-line top"></div><div class="drum-sel-line bot"></div></div>
            <div class="ampm-stack"><button class="ampm-btn active" id="endAmBtn">AM</button><button class="ampm-btn" id="endPmBtn">PM</button></div>

<!-- Drum overlay (start time editor) -->
<div class="drum-overlay" id="drumOverlay">
  <div class="drum-sheet">
    <div class="drum-handle"></div>
    <div class="drum-title">Session Started</div>
    <div class="drum-row" id="drumRow"></div>
    <button class="drum-done-btn" id="drumDoneBtn">Done</button>
  </div>
</div>

<!-- Context menu -->
<div id="ctxMenu" style="display:none"></div>

<script>
// ─────────────────────────────────────────
// Storage
// ─────────────────────────────────────────
const K_CATS = 'focus:categories';
const K_SESS = 'focus:sessions';
const PALETTE = ['#6BE3A4','#7B9CEF','#FFB347','#FF6B6B','#C77DFF','#38B6FF','#FCD34D','#F8A4C8','#6EE7B7','#FDBA74'];
const DEFAULT_CAT = { id: 'cat_work', name: 'Work', color: '#6BE3A4', builtin: true };

function getCats() { try { return JSON.parse(localStorage.getItem(K_CATS)) || []; } catch { return []; } }
function saveCats(c) { localStorage.setItem(K_CATS, JSON.stringify(c)); if(window.__syncKey) window.__syncKey(K_CATS, JSON.stringify(c)); }
function getSess() { try { return JSON.parse(localStorage.getItem(K_SESS)) || []; } catch { return []; } }
function saveSess(s) { localStorage.setItem(K_SESS, JSON.stringify(s)); if(window.__syncKey) window.__syncKey(K_SESS, JSON.stringify(s)); }

function ensureDefaults() {
  let c = getCats();
  const hasWork = c.some(x => x.id === 'cat_work' && !x.archived);
  if (!c.length || !hasWork) {
    c = c.filter(x => x.id !== 'cat_work');
    c.unshift(DEFAULT_CAT);
    saveCats(c);
  }
  return c;
}

// ─────────────────────────────────────────
// Colour helpers
// ─────────────────────────────────────────
function hexToRgba(hex, a) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}
function rgbToHsv(r,g,b) {
  r/=255; g/=255; b/=255;
  const max=Math.max(r,g,b), min=Math.min(r,g,b), d=max-min;
  let h=0, s=max===0?0:d/max, v=max;
  if(d!==0){
    if(max===r) h=((g-b)/d)%6;
    else if(max===g) h=(b-r)/d+2;
    else h=(r-g)/d+4;
    h=Math.round(h*60); if(h<0) h+=360;
  }
  return [h,s,v];
}
function hsvToHex(h,s,v) {
  const f=n=>{ const k=(n+h/60)%6; return v-v*s*Math.max(0,Math.min(k,4-k,1)); };
  const r=Math.round(f(5)*255), g=Math.round(f(3)*255), b=Math.round(f(1)*255);
  return '#'+[r,g,b].map(x=>x.toString(16).padStart(2,'0')).join('');
}

// ─────────────────────────────────────────
// HSV picker
// ─────────────────────────────────────────
let hsvH=145, hsvS=0.53, hsvV=0.89;
let pickerColor = '#6BE3A4';
let editingCatId = null;

function drawHsvCanvas() {
  const cv=document.getElementById('hsvCanvas'); if(!cv) return;
  const ctx=cv.getContext('2d'), W=cv.width, H=cv.height;
  const gS=ctx.createLinearGradient(0,0,W,0);
  gS.addColorStop(0,'#fff'); gS.addColorStop(1,hsvToHex(hsvH,1,1));
  ctx.fillStyle=gS; ctx.fillRect(0,0,W,H);
  const gV=ctx.createLinearGradient(0,0,0,H);
  gV.addColorStop(0,'transparent'); gV.addColorStop(1,'#000');
  ctx.fillStyle=gV; ctx.fillRect(0,0,W,H);
  const cx=hsvS*W, cy=(1-hsvV)*H;
  ctx.beginPath(); ctx.arc(cx,cy,7,0,Math.PI*2);
  ctx.strokeStyle='rgba(255,255,255,0.9)'; ctx.lineWidth=2; ctx.stroke();
}
function drawHueSlider() {
  const cv=document.getElementById('hueSlider'); if(!cv) return;
  const ctx=cv.getContext('2d'), W=cv.width, H=cv.height;
  const g=ctx.createLinearGradient(0,0,0,H);
  for(let i=0;i<=360;i+=30) g.addColorStop(i/360,`hsl(${i},100%,50%)`);
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const y=(hsvH/360)*H;
  ctx.strokeStyle='#fff'; ctx.lineWidth=2; ctx.strokeRect(0,y-3,W,6);
}
function updateHsvPreview() {
  pickerColor=hsvToHex(hsvH,hsvS,hsvV);
  const p=document.getElementById('hsvPreview'), h=document.getElementById('hsvHex');
  if(p) p.style.background=pickerColor;
  if(h) h.textContent=pickerColor;
  document.querySelectorAll('.pal-swatch').forEach(s=>s.classList.toggle('sel',s.dataset.color===pickerColor));
}
function setHsvFromHex(hex) {
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  [hsvH,hsvS,hsvV]=rgbToHsv(r,g,b);
  drawHsvCanvas(); drawHueSlider(); updateHsvPreview();
}

// HSV canvas events
(function(){
  const cv=document.getElementById('hsvCanvas'), hue=document.getElementById('hueSlider');
  function pickSv(e){ const r=cv.getBoundingClientRect(); hsvS=Math.max(0,Math.min((e.clientX-r.left)/r.width,1)); hsvV=1-Math.max(0,Math.min((e.clientY-r.top)/r.height,1)); drawHsvCanvas(); updateHsvPreview(); }
  function pickHue(e){ const r=hue.getBoundingClientRect(); hsvH=Math.round(Math.max(0,Math.min((e.clientY-r.top)/r.height,1))*360); drawHsvCanvas(); drawHueSlider(); updateHsvPreview(); }
  let ds=false,dh=false;
  cv.addEventListener('pointerdown',e=>{ds=true;cv.setPointerCapture(e.pointerId);pickSv(e);});
  cv.addEventListener('pointermove',e=>{if(ds)pickSv(e);});
  cv.addEventListener('pointerup',()=>ds=false);
  hue.addEventListener('pointerdown',e=>{dh=true;hue.setPointerCapture(e.pointerId);pickHue(e);});
  hue.addEventListener('pointermove',e=>{if(dh)pickHue(e);});
  hue.addEventListener('pointerup',()=>dh=false);
  const pr=document.getElementById('paletteRow');
  PALETTE.forEach(c=>{ const s=document.createElement('button'); s.className='pal-swatch'; s.dataset.color=c; s.style.background=c; s.addEventListener('click',()=>setHsvFromHex(c)); pr.appendChild(s); });
  drawHsvCanvas(); drawHueSlider(); updateHsvPreview();
})();

// ─────────────────────────────────────────
// Categories
// ─────────────────────────────────────────
let cats = ensureDefaults();
let activeCatId = cats.find(c=>!c.archived)?.id || 'cat_work';

let editMode = false;

function renderCatBar() {
  const bar=document.getElementById('catBar');
  bar.innerHTML='';
  const activeCats=cats.filter(c=>!c.archived);

    : `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M8.5 1.5a1.414 1.414 0 0 1 2 2L3.5 10.5H1v-2.5L8.5 1.5z" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  pencilBtn.addEventListener('click',()=>{ editMode=!editMode; renderCatBar(); });

  // + New

function deleteCat(id) {
  cats=cats.map(c=>c.id===id?{...c,archived:true}:c);
  // If nothing left, restore Work immediately
  if(!cats.filter(c=>!c.archived).length){
    const wi=cats.findIndex(c=>c.id==='cat_work');
    if(wi>=0) cats[wi]={...cats[wi],archived:false};
    else cats.unshift({...DEFAULT_CAT});
  }
  saveCats(cats);
  if(activeCatId===id) activeCatId=cats.find(c=>!c.archived)?.id||'cat_work';
  // stay in edit mode so user can keep deleting
  renderCatBar(); renderTimerControls();
}

// ─────────────────────────────────────────
// Timer — Pomodoro | Stopwatch | Timer
// ─────────────────────────────────────────
const PRESETS = {
  pomodoro: { work:1500, brk:300 },
  long:     { work:3000, brk:600 },
  deep:     { work:5400, brk:1200 },
  custom:   { work:1500, brk:300 }
};
const CIRC   = 2 * Math.PI * 90; // 565.49
const SW_REF = 1500;              // stopwatch fills ring over 25 min

let timerMode    = 'pomodoro';
let activePreset = 'pomodoro';
let timerPhase   = 'work';
let timerState   = 'idle';
let workTotal    = 1500;
let breakTotal   = 300;
let remaining    = 1500;
let startTs      = 0;
let startRem     = 1500;
let rafId        = null;
let sessionStart = null;
let transTimeout = null;
let swElapsed    = 0;  // stopwatch accumulated seconds
let swStartTs    = 0;

function hasCat() { return !!(activeCatId&&cats.find(c=>c.id===activeCatId&&!c.archived)); }
function getCatLabel() {
  if(timerPhase==='break') return 'Break';
  const cat=cats.find(c=>c.id===activeCatId&&!c.archived);
  return cat?cat.name:'Focus';
}

function fmtSecs(s) { s=Math.max(0,Math.ceil(s)); const m=Math.floor(s/60),sec=s%60; return `${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }
function fmtElapsed(s) { s=Math.floor(Math.max(0,s)); const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; return h>0?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`; }
function fmtHm(s) { const h=Math.floor(s/3600),m=Math.floor((s%3600)/60); return h>0?`${h}h ${m}m`:`${m}m`; }
function fmtDuration(s) { const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60; if(h>0)return`${h}h ${m}m`; if(m>0)return`${m}m ${sec}s`; return`${sec}s`; }

function getLiveRemaining() { return timerState==='running'?Math.max(0,startRem-(Date.now()-startTs)/1000):remaining; }
function swGetElapsed() { return swElapsed+(timerState==='running'?(Date.now()-swStartTs)/1000:0); }

function updateRing(rem,total) {
  document.getElementById('ringProgress').style.strokeDashoffset = CIRC*(1-(total>0?rem/total:1));
  document.getElementById('ringTime').textContent = fmtDisplaySecs(rem);
}
function updateRingSw(elapsed) {
  document.getElementById('ringProgress').style.strokeDashoffset = Math.max(0, CIRC*(1-Math.min(elapsed/SW_REF,1)));
  document.getElementById('ringTime').textContent = fmtDisplaySecs(elapsed);
}

function tickCountdown() {
  if(timerState!=='running') return;
  const rem=getLiveRemaining(), total=timerPhase==='work'?workTotal:breakTotal;
  updateRing(rem,total);
  if(rem<=0){ onPhaseComplete(); return; }
  rafId=requestAnimationFrame(tickCountdown);
}
function tickStopwatch() {
  if(timerState!=='running') return;
  updateRingSw(swGetElapsed());
  rafId=requestAnimationFrame(tickStopwatch);
}

function doStart() {
  if(timerMode==='stopwatch') {
    if(timerState==='idle'){ if(!hasCat()) return; sessionStart=new Date(); swElapsed=0; document.getElementById('ringProgress').style.stroke='#6BE3A4'; }
    swStartTs=Date.now(); timerState='running';
    setPhaseLabel(getCatLabel(),true); renderTimerControls();
    rafId=requestAnimationFrame(tickStopwatch); return;
  }
  if(timerState==='idle'){
    if(!hasCat()) return; sessionStart=new Date(); timerPhase='work';
    if(timerMode==='timer'){ workTotal=getTimerWorkTotal(); document.getElementById('timerDurRow').classList.add('picker-hidden'); }
    if(timerMode==='pomodoro') document.getElementById('pomodoroPresets').classList.add('picker-hidden');
    remaining=workTotal; document.getElementById('ringProgress').style.stroke='#6BE3A4';
  }
  startTs=Date.now(); startRem=remaining; timerState='running';
  setPhaseLabel(getCatLabel(),true); renderTimerControls();
  rafId=requestAnimationFrame(tickCountdown);
}

function doPause() {
  if(timerMode==='stopwatch') swElapsed=swGetElapsed(); else remaining=getLiveRemaining();
  timerState='paused'; cancelAnimationFrame(rafId);
  setPhaseLabel(getCatLabel(),false); renderTimerControls();
}

function doReset() {
  cancelAnimationFrame(rafId); clearTimeout(transTimeout);
  if(timerMode==='stopwatch'){ const e=swGetElapsed(); if(e>=5) autoLog(Math.round(e)); swElapsed=0; swStartTs=0; }
  else if(timerPhase==='work'&&timerState!=='idle'){ const w=Math.round(workTotal-getLiveRemaining()); if(w>=5) autoLog(w); }
  resetToIdle();
}

function doCompleteEarly() {
  cancelAnimationFrame(rafId); clearTimeout(transTimeout);
  if(timerMode==='stopwatch'){ const e=swGetElapsed(); if(e>=5) autoLog(Math.round(e)); swElapsed=0; }
  else { const w=Math.round(workTotal-remaining); if(w>=5) autoLog(w); }
  resetToIdle();
}

function onPhaseComplete() {
  cancelAnimationFrame(rafId); timerState='complete';
  if(timerPhase==='work'){
    autoLog(workTotal); playChime(); showCompletion();
    transTimeout=setTimeout(()=>{ hideCompletion(); timerMode==='pomodoro'?startBreak():resetToIdle(); }, timerMode==='pomodoro'?3000:2500);
  } else { playChime(); showCompletion(); transTimeout=setTimeout(()=>{ hideCompletion(); resetToIdle(); },2200); }
  renderTimerControls();
}

function startBreak() {
  timerPhase='break'; timerState='running'; remaining=breakTotal;
  startTs=Date.now(); startRem=breakTotal;
  document.getElementById('ringProgress').style.stroke='rgba(107,227,164,0.4)';
  setPhaseLabel('Break',true); updateRing(breakTotal,breakTotal); renderTimerControls();
  rafId=requestAnimationFrame(tickCountdown);
}

function resetToIdle() {
  timerState='idle'; timerPhase='work'; cancelAnimationFrame(rafId);
  const rp=document.getElementById('ringProgress');
  rp.style.stroke='#6BE3A4'; rp.classList.remove('glowing');
  document.getElementById('ringTime').style.opacity='1';
  if(timerMode==='stopwatch'){
    swElapsed=0; swStartTs=0; rp.style.strokeDashoffset=CIRC; document.getElementById('ringTime').textContent='00:00';
  } else {
    if(timerMode==='timer'){ document.getElementById('timerDurRow').classList.remove('picker-hidden'); updateTimerFromHrMode(); }
    if(timerMode==='pomodoro') document.getElementById('pomodoroPresets').classList.remove('picker-hidden');
    remaining=workTotal; rp.style.strokeDashoffset='0'; document.getElementById('ringTime').textContent=fmtDisplaySecs(workTotal);
  }
  setPhaseLabel(getCatLabel(),false); hideCompletion(); renderTimerControls(); updateTodayCard();
}

function setPhaseLabel(text,running) {
  const el=document.getElementById('ringPhase'); el.style.opacity='1';
  if(running) el.innerHTML=`<span class="pulse-dot"></span> ${text}`; else el.textContent=text;
}

function showCompletion() {
  const rp=document.getElementById('ringProgress'); rp.style.strokeDashoffset='0'; rp.classList.add('glowing');
  ['rp1','rp2','rp3'].forEach(id=>document.getElementById(id).classList.add('active'));
  document.getElementById('checkOverlay').classList.add('show');
  const path=document.getElementById('checkPath'), len=path.getTotalLength();
  path.style.transition='none'; path.style.strokeDasharray=len; path.style.strokeDashoffset=len;
  document.getElementById('ringTime').style.opacity='0'; document.getElementById('ringPhase').style.opacity='0';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ path.style.transition='stroke-dashoffset 0.65s cubic-bezier(0.22,1,0.36,1)'; path.style.strokeDashoffset='0'; }));
}
function hideCompletion() {
  document.getElementById('ringProgress').classList.remove('glowing');
  ['rp1','rp2','rp3'].forEach(id=>document.getElementById(id).classList.remove('active'));
  document.getElementById('checkOverlay').classList.remove('show');
  document.getElementById('checkPath').style.transition='none';
}

function renderTimerControls() {
  const startBtn=document.getElementById('startBtn'), resetBtn=document.getElementById('resetBtn');
  const completeBtn=document.getElementById('completeBtn'), hint=document.getElementById('startHint');
  const controls=document.getElementById('timerControls');
  controls.style.display=''; completeBtn.style.display='none'; hint.style.display='none';
  if(timerState==='complete'){ controls.style.display='none'; return; }
  if(timerState==='idle'){ startBtn.textContent='Start'; startBtn.disabled=!hasCat(); resetBtn.style.display='none'; hint.style.display=hasCat()?'none':'block'; return; }
  startBtn.disabled=false; resetBtn.style.display='';
  if(timerState==='running'){ startBtn.textContent='Pause'; resetBtn.textContent=timerPhase==='break'?'Skip Break':'Reset'; }
  else { startBtn.textContent='Resume'; resetBtn.textContent='Reset'; if(timerPhase==='work'||timerMode==='stopwatch') completeBtn.style.display=''; }
}

let cwDrum, cbDrum, timerHrDrum, timerHrMinDrum;
let timerDisplayFmt = 'ms'; // 'ms' = MM:SS  |  'hms' = H:MM:SS

function fmtDisplaySecs(secs) {
  secs = Math.max(0, Math.ceil(secs));
  const h=Math.floor(secs/3600), m=Math.floor((secs%3600)/60), s=secs%60;
  if(timerDisplayFmt==='hms') return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
  const tm=Math.floor(secs/60);
  return `${String(tm).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function updateCustomLabel() {

function autoLog(durationSeconds) {

// Today So Far
// ─────────────────────────────────────────
let todayRange = 'day';

function getFilterStart(range) {
  const now=new Date();
  if(range==='day'){ const d=new Date(now); d.setHours(0,0,0,0); return d; }
  if(range==='week'){ const d=new Date(now); d.setDate(d.getDate()-d.getDay()); d.setHours(0,0,0,0); return d; }
  if(range==='month'){ return new Date(now.getFullYear(),now.getMonth(),1); }
  if(range==='year'){ return new Date(now.getFullYear(),0,1); }
  return new Date(0);
}

function updateTodayCard() {
  const sess=getSess();
  const start=getFilterStart(todayRange);
  const filtered=sess.filter(s=>new Date(s.at)>=start);
  const total=filtered.reduce((a,s)=>a+s.durationSeconds,0);
  const card=document.getElementById('todayCard');
  if(total===0){ card.style.display='none'; return; }
  card.style.display='';
  const titles={day:'Today So Far',week:'This Week',month:'This Month',year:'This Year'};
  document.getElementById('todayCardTitle').textContent=titles[todayRange]||'Today So Far';
  document.getElementById('todayTotal').textContent=fmtHm(total);
  const catTotals={};
  filtered.forEach(s=>{ catTotals[s.categoryId]=(catTotals[s.categoryId]||0)+s.durationSeconds; });
  const sorted=Object.entries(catTotals).sort((a,b)=>b[1]-a[1]);
  const maxVal=sorted[0]?.[1]||1;
  const list=document.getElementById('todayCatsList');
  list.innerHTML='';
  sorted.forEach(([catId,secs])=>{
    const cat=cats.find(c=>c.id===catId)||{name:catId,color:'#6BE3A4'};
    const pct=Math.round(secs/total*100);
    const barW=Math.round(secs/maxVal*100);
    const row=document.createElement('div');
    row.className='today-cat-row';
    row.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:5px">
      <div>
        <div style="font-size:13px;font-weight:700;color:var(--text-primary)">${cat.name}</div>
        <div style="font-size:12px;color:var(--text-tertiary)">${fmtHm(secs)}</div>
      </div>
      <div style="font-size:12px;font-weight:700;color:var(--text-tertiary)">${pct}%</div>
    </div>
    <div class="today-bar-track">
      <div class="today-bar-fill" style="width:${barW}%;background:${cat.color}"></div>
    </div>`;
    list.appendChild(row);
  });
}

// Chime
// ─────────────────────────────────────────
function playChime() {
  try {
    const ac=new(window.AudioContext||window.webkitAudioContext)();
    [[523,0],[659,0.15],[784,0.30]].forEach(([freq,t])=>{
      const osc=ac.createOscillator(), g=ac.createGain();
      osc.connect(g); g.connect(ac.destination);
      osc.frequency.value=freq; osc.type='sine';
      g.gain.setValueAtTime(0,ac.currentTime+t);
      g.gain.linearRampToValueAtTime(0.22,ac.currentTime+t+0.04);
      g.gain.exponentialRampToValueAtTime(0.001,ac.currentTime+t+0.7);
      osc.start(ac.currentTime+t); osc.stop(ac.currentTime+t+0.7);
    });
  } catch{}
}

function aggregateByBucket(){
  const sess=getSess(), now=new Date();
  let labels=[],numBuckets=0,bucketFn,filter;
  if(period==='today'){
    numBuckets=24;
    labels=Array.from({length:24},(_,i)=>i%6===0?(i===0?'12a':i<12?i+'a':i===12?'12p':(i-12)+'p'):'');
    bucketFn=s=>new Date(s.at).getHours();
    filter=s=>new Date(s.at).toDateString()===now.toDateString();
  } else if(period==='7d'){
    numBuckets=7;
    const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    labels=Array.from({length:7},(_,i)=>{ const d=new Date(now); d.setDate(d.getDate()-6+i); return days[d.getDay()]; });
    const base=new Date(now); base.setDate(base.getDate()-6); base.setHours(0,0,0,0);
    bucketFn=s=>{ const d=new Date(s.at); d.setHours(0,0,0,0); return Math.round((d-base)/86400000); };
    filter=s=>new Date(s.at)>=base;
  } else if(period==='month'){
    numBuckets=5; labels=['Wk 1','Wk 2','Wk 3','Wk 4','Wk 5'];
    const yr=now.getFullYear(), mo=now.getMonth();
    filter=s=>{ const d=new Date(s.at); return d.getFullYear()===yr&&d.getMonth()===mo; };
    bucketFn=s=>Math.min(4,Math.floor((new Date(s.at).getDate()-1)/7));
  } else {
    numBuckets=12; labels=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    filter=s=>new Date(s.at).getFullYear()===now.getFullYear();
    bucketFn=s=>new Date(s.at).getMonth();
  }
  const totals=Array(numBuckets).fill(0);
  const catTotals={};
  sess.filter(filter).forEach(s=>{
    const b=bucketFn(s);
    if(b>=0&&b<numBuckets) totals[b]+=s.durationSeconds;
    catTotals[s.categoryId]=(catTotals[s.categoryId]||0)+s.durationSeconds;
  });
  return {labels,totals,numBuckets,catTotals};
}

function drawLineGraph(labels,totals){
  const svg=document.getElementById('lineSvg');
  svg.innerHTML='';
  const W=400,H=140,PAD_T=10,PAD_B=20;
  const gH=H-PAD_T-PAD_B;
  const max=Math.max(...totals,1);
  const pts=totals.map((v,i)=>({x:(i/(totals.length-1||1))*W, y:PAD_T+gH-(v/max)*gH}));
  const defs=document.createElementNS('http://www.w3.org/2000/svg','defs');
  const grad=document.createElementNS('http://www.w3.org/2000/svg','linearGradient');
  grad.setAttribute('id','lgGrad'); grad.setAttribute('x1','0'); grad.setAttribute('y1','0'); grad.setAttribute('x2','0'); grad.setAttribute('y2','1');
  const s1=document.createElementNS('http://www.w3.org/2000/svg','stop'); s1.setAttribute('offset','0'); s1.setAttribute('stop-color','rgba(107,227,164,0.3)');
  const s2=document.createElementNS('http://www.w3.org/2000/svg','stop'); s2.setAttribute('offset','1'); s2.setAttribute('stop-color','rgba(107,227,164,0)');
  grad.appendChild(s1); grad.appendChild(s2); defs.appendChild(grad); svg.appendChild(defs);
  function buildD(p){ if(p.length<2) return p.length?`M${p[0].x},${p[0].y}`:''; let d=`M${p[0].x},${p[0].y}`; for(let i=0;i<p.length-1;i++){ const cpx=(p[i].x+p[i+1].x)/2; d+=` C${cpx},${p[i].y},${cpx},${p[i+1].y},${p[i+1].x},${p[i+1].y}`; } return d; }
  const ld=buildD(pts);
  const last=pts[pts.length-1];
  const area=document.createElementNS('http://www.w3.org/2000/svg','path');
  area.setAttribute('d',ld+` L${last.x},${H} L0,${H} Z`); area.setAttribute('fill','url(#lgGrad)'); area.setAttribute('stroke','none');
  svg.appendChild(area);
  const line=document.createElementNS('http://www.w3.org/2000/svg','path');
  line.setAttribute('d',ld); line.setAttribute('fill','none'); line.setAttribute('stroke','#6BE3A4'); line.setAttribute('stroke-width','2'); line.setAttribute('stroke-linecap','round'); line.setAttribute('stroke-linejoin','round');
  svg.appendChild(line);
  const len=line.getTotalLength();
  line.style.strokeDasharray=len; line.style.strokeDashoffset=len; line.style.transition='none';
  requestAnimationFrame(()=>requestAnimationFrame(()=>{ line.style.transition='stroke-dashoffset 0.8s cubic-bezier(0.22,1,0.36,1)'; line.style.strokeDashoffset='0'; }));
  pts.forEach(p=>{ const c=document.createElementNS('http://www.w3.org/2000/svg','circle'); c.setAttribute('cx',p.x); c.setAttribute('cy',p.y); c.setAttribute('r','3'); c.setAttribute('fill','#6BE3A4'); svg.appendChild(c); });
  const lblEl=document.getElementById('lgLabels'); lblEl.innerHTML='';
  labels.forEach(l=>{ const s=document.createElement('span'); s.textContent=l; lblEl.appendChild(s); });
}

let donutRaf=null;
function drawDonutFrame(data,prog,hlIdx){
  const cv=document.getElementById('donutCanvas'), ctx=cv.getContext('2d');
  const W=cv.width,H=cv.height,cx=W/2,cy=H/2,R=Math.min(W,H)/2-16,RI=R-22;
  ctx.clearRect(0,0,W,H);
  const total=data.reduce((a,d)=>a+d.val,0)||1;
  let start=-Math.PI/2;
  data.forEach((d,i)=>{
    const sweep=(d.val/total)*Math.PI*2, hl=i===hlIdx, r=hl?R+4:R, ri=hl?RI-2:RI;
    ctx.save(); ctx.shadowBlur=hl?18:8; ctx.shadowColor=hexToRgba(d.color,hl?0.7:0.4);
    ctx.beginPath(); ctx.arc(cx,cy,r,start,start+sweep*prog); ctx.arc(cx,cy,ri,start+sweep*prog,start,true); ctx.closePath();
    ctx.fillStyle=d.color; ctx.fill(); ctx.restore(); start+=sweep*prog;
  });
  if(!data.length||!total){ ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.arc(cx,cy,RI,Math.PI*2,0,true); ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.fill(); }
}
function animDonut(data,hlIdx=null){
  if(donutRaf) cancelAnimationFrame(donutRaf);
  let prog=0;
  function frame(){ prog=Math.min(1,prog+0.055); drawDonutFrame(data,prog,hlIdx); if(prog<1) donutRaf=requestAnimationFrame(frame); }
  requestAnimationFrame(frame);
}

function drawCharts(){
  const {labels,totals,catTotals}=aggregateByBucket();
  drawLineGraph(labels,totals);
  const donutData=Object.entries(catTotals).map(([id,val])=>{ const cat=cats.find(c=>c.id===id)||{name:id,color:'#76746E'}; return {id,name:cat.name,color:cat.color,val}; }).sort((a,b)=>b.val-a.val);
  const hlIdx=highlightedCatId?donutData.findIndex(d=>d.id===highlightedCatId):null;
  animDonut(donutData,hlIdx<0?null:hlIdx);
  const leg=document.getElementById('donutLegend'); leg.innerHTML='';
  const totalSecs=donutData.reduce((a,d)=>a+d.val,0)||1;
  donutData.forEach((d,i)=>{
    const pill=document.createElement('div'); pill.className='legend-pill'+(d.id===highlightedCatId?' highlight':'');
    pill.innerHTML=`<div class="legend-dot" style="background:${d.color}"></div><div class="legend-name-col"><span class="legend-name">${d.name}</span><span class="legend-subtime">${fmtHm(d.val)}</span></div><span class="legend-pct">${Math.round(d.val/totalSecs*100)}%</span>`;
    pill.addEventListener('click',()=>{ highlightedCatId=highlightedCatId===d.id?null:d.id; animDonut(donutData,highlightedCatId?donutData.findIndex(x=>x.id===highlightedCatId):null); document.querySelectorAll('.legend-pill').forEach((p,j)=>p.classList.toggle('highlight',j===i&&!!highlightedCatId)); });
    leg.appendChild(pill);
  });
  if(!donutData.length){ leg.innerHTML='<div style="color:var(--text-tertiary);font-size:13px;padding:10px 0">No data yet</div>'; animDonut([],null); }
}

// ─────────────────────────────────────────
// Sessions list
// ─────────────────────────────────────────
let sessEditMode = false;

function renderSessions() {
  const list=document.getElementById('sessList');
  const editBtn=document.getElementById('sessEditBtn');
  const all=getSess().slice().reverse();
  const sess=all.slice(0,50);
  if(!sess.length){
    list.innerHTML='<div class="sess-empty">No sessions yet — start the timer to begin!</div>';
    editBtn.style.display='none'; sessEditMode=false; editBtn.classList.remove('on'); return;
  }
  editBtn.style.display='';
  list.innerHTML='';
  sess.forEach(s=>{
    const cat=cats.find(c=>c.id===s.categoryId)||{name:'Unknown',color:'#76746E'};
    const d=new Date(s.at);
    const timeStr=d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const dateStr=d.toLocaleDateString([],{month:'short',day:'numeric'});
    const item=document.createElement('div'); item.className='sess-item';
    if(sessEditMode){
      item.style.cursor='default';
      item.innerHTML=`<div class="sess-bar" style="background:${cat.color}"></div><div class="sess-body"><div class="sess-cat">${cat.name}</div><div class="sess-meta">${dateStr} · ${timeStr}</div></div><div class="sess-dur">${fmtDuration(s.durationSeconds)}</div><button class="sess-del-btn" data-id="${s.id}">×</button>`;
    } else {
      item.innerHTML=`<div class="sess-bar" style="background:${cat.color}"></div><div class="sess-body"><div class="sess-cat">${cat.name}</div><div class="sess-meta">${dateStr} · ${timeStr}</div></div><div class="sess-dur">${fmtDuration(s.durationSeconds)}</div>`;
      item.addEventListener('click',()=>openEditSession(s));
    }
    list.appendChild(item);
  });
  list.querySelectorAll('.sess-del-btn').forEach(btn=>{
    btn.addEventListener('click',e=>{ e.stopPropagation(); deleteSession(btn.dataset.id); });
  });
}

function deleteSession(id) {
  saveSess(getSess().filter(s=>s.id!==id));
  renderSessions(); drawCharts(); updateTodayCard();
}

// ── Collapse toggle ──
document.getElementById('sessCollapseBtn').addEventListener('click',()=>{
  const col=document.getElementById('sessCollapsible');
  const chev=document.querySelector('.chevron-svg');
  col.classList.toggle('collapsed');
  chev.classList.toggle('flipped');
});

// ── Edit mode toggle ──
document.getElementById('sessEditBtn').addEventListener('click',()=>{
  sessEditMode=!sessEditMode;
  document.getElementById('sessEditBtn').classList.toggle('on',sessEditMode);
  renderSessions();
});

// ─────────────────────────────────────────
// Edit Session Overlay
// ─────────────────────────────────────────
let _editSessId=null, _calY, _calM, _calD;
let _startAp='AM', _endAp='AM';
let _editDrumsReady=false;
let _startHrD,_startMinD,_endHrD,_endMinD;

const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WDAYS=['S','M','T','W','T','F','S'];

function _initEditDrums(){
  if(_editDrumsReady) return; _editDrumsReady=true;
  const hr12=Array.from({length:12},(_,i)=>String(i+1).padStart(2,'0'));
  const mins=Array.from({length:60},(_,i)=>String(i).padStart(2,'0'));
  _startHrD=makeDrum(document.getElementById('editStartHr'),hr12,0,()=>{});
  _startMinD=makeDrum(document.getElementById('editStartMin'),mins,0,()=>{});
  _endHrD=makeDrum(document.getElementById('editEndHr'),hr12,0,()=>{});
  _endMinD=makeDrum(document.getElementById('editEndMin'),mins,0,()=>{});
}

function _renderCal(){
  const now=new Date();
  document.getElementById('calMonthLbl').textContent=`${MONTHS[_calM]} ${_calY}`;
  const wds=document.getElementById('calWds');
  if(!wds.children.length) WDAYS.forEach(w=>{ const d=document.createElement('div'); d.className='cal-wd'; d.textContent=w; wds.appendChild(d); });
  const days=document.getElementById('calDays'); days.innerHTML='';
  const first=new Date(_calY,_calM,1).getDay();
  const total=new Date(_calY,_calM+1,0).getDate();
  for(let i=0;i<first;i++){ const e=document.createElement('div'); e.className='cal-day'; days.appendChild(e); }
  for(let d=1;d<=total;d++){
    const thisDate=new Date(_calY,_calM,d);
    const future=thisDate>now&&thisDate.toDateString()!==now.toDateString();
    const sel=d===_calD;
    const today=thisDate.toDateString()===now.toDateString();
    const el=document.createElement('div');
    el.className='cal-day'+(sel?' cal-sel':'')+(today&&!sel?' cal-today':'')+(future?' cal-disabled':'');
    el.textContent=d;
    if(!future) el.addEventListener('click',()=>{ _calD=d; _renderCal(); });
    days.appendChild(el);
  }
}

function openEditSession(s){
  _editSessId=s.id;
  const d=new Date(s.at);
  _calY=d.getFullYear(); _calM=d.getMonth(); _calD=d.getDate();
  _initEditDrums();
  // Start time
  let sh=d.getHours(), sm=d.getMinutes();
  _startAp=sh>=12?'PM':'AM'; sh=sh%12||12;
  _startHrD.setIdx(sh-1); _startMinD.setIdx(sm);
  // End time
  const ed=new Date(d.getTime()+s.durationSeconds*1000);
  let eh=ed.getHours(), em=ed.getMinutes();
  _endAp=eh>=12?'PM':'AM'; eh=eh%12||12;
  _endHrD.setIdx(eh-1); _endMinD.setIdx(em);
  _syncAmPm();
  _renderCal();
  document.getElementById('editOverlay').classList.add('open');
}

function openNewSession(){
  _editSessId=null;
  const now=new Date();
  _calY=now.getFullYear(); _calM=now.getMonth(); _calD=now.getDate();
  _initEditDrums();
  let sh=now.getHours(), sm=now.getMinutes();
  _startAp=sh>=12?'PM':'AM'; sh=sh%12||12;
  _startHrD.setIdx(sh-1); _startMinD.setIdx(sm);
  const end=new Date(now.getTime()+3600000);
  let eh=end.getHours(), em=end.getMinutes();
  _endAp=eh>=12?'PM':'AM'; eh=eh%12||12;
  _endHrD.setIdx(eh-1); _endMinD.setIdx(em);
  _syncAmPm();
  _renderCal();
  document.querySelector('.edit-title-row').textContent='Add Session';
  document.getElementById('editSaveBtn').textContent='Add Session';
  document.getElementById('editOverlay').classList.add('open');
}
document.getElementById('sessAddBtn').addEventListener('click', openNewSession);

function _syncAmPm(){
  document.getElementById('startAmBtn').classList.toggle('active',_startAp==='AM');
  document.getElementById('startPmBtn').classList.toggle('active',_startAp==='PM');
  document.getElementById('endAmBtn').classList.toggle('active',_endAp==='AM');
  document.getElementById('endPmBtn').classList.toggle('active',_endAp==='PM');
}

document.getElementById('calPrev').addEventListener('click',()=>{
  _calM--; if(_calM<0){_calM=11;_calY--;} _calD=Math.min(_calD,new Date(_calY,_calM+1,0).getDate()); _renderCal();
});
document.getElementById('calNext').addEventListener('click',()=>{
  const now=new Date();
  if(_calY>now.getFullYear()||(_calY===now.getFullYear()&&_calM>=now.getMonth())) return;
  _calM++; if(_calM>11){_calM=0;_calY++;} _calD=Math.min(_calD,new Date(_calY,_calM+1,0).getDate()); _renderCal();
});
document.getElementById('startAmBtn').addEventListener('click',()=>{_startAp='AM';_syncAmPm();});
document.getElementById('startPmBtn').addEventListener('click',()=>{_startAp='PM';_syncAmPm();});
document.getElementById('endAmBtn').addEventListener('click',()=>{_endAp='AM';_syncAmPm();});
document.getElementById('endPmBtn').addEventListener('click',()=>{_endAp='PM';_syncAmPm();});

document.getElementById('editSaveBtn').addEventListener('click',()=>{
  const sh12=parseInt(_startHrD.getValue()), sm=parseInt(_startMinD.getValue());
  const sh24=_startAp==='AM'?(sh12===12?0:sh12):(sh12===12?12:sh12+12);
  const startDate=new Date(_calY,_calM,_calD,sh24,sm,0);
  const eh12=parseInt(_endHrD.getValue()), em=parseInt(_endMinD.getValue());
  const eh24=_endAp==='AM'?(eh12===12?0:eh12):(eh12===12?12:eh12+12);
  let endDate=new Date(_calY,_calM,_calD,eh24,em,0);
  if(endDate<=startDate) endDate=new Date(endDate.getTime()+86400000);
  const dur=Math.max(60,Math.round((endDate-startDate)/1000));
  if(_editSessId){
    saveSess(getSess().map(s=>s.id===_editSessId?{...s,at:startDate.toISOString(),durationSeconds:dur}:s));
  } else {
    const catId=(cats.find(c=>c.id===activeCatId&&!c.archived)||cats.find(c=>!c.archived)||DEFAULT_CAT).id;
    saveSess([...getSess(),{id:'sess_'+Date.now(),categoryId:catId,durationSeconds:dur,at:startDate.toISOString()}]);
  }
  renderSessions(); drawCharts(); updateTodayCard();
  document.getElementById('editSaveBtn').textContent='Save';
  document.querySelector('.edit-title-row').textContent='Edit Session';
  document.getElementById('editOverlay').classList.remove('open'); _editSessId=null;
});
document.getElementById('editOverlay').addEventListener('click',e=>{ if(e.target===document.getElementById('editOverlay')) document.getElementById('editOverlay').classList.remove('open'); });

// ─────────────────────────────────────────
// Drum picker (kept for potential future use)
// ─────────────────────────────────────────
const ITEM_H=38,DRUM_H=190,DRUM_CTR=95;
function drumGetTy(idx){ return DRUM_CTR-idx*ITEM_H-ITEM_H/2; }
function makeDrum(wrapEl,items,initIdx,onChange){
  wrapEl.style.height=DRUM_H+'px';
  let curIdx=Math.max(0,Math.min(initIdx,items.length-1));
  let ty=drumGetTy(curIdx);
  const track=document.createElement('div'); track.className='drum-track';
  items.forEach((item,i)=>{ const d=document.createElement('div'); d.className='drum-item'+(i===curIdx?' sel':''); d.textContent=item; track.appendChild(d); });
  wrapEl.appendChild(track);
  function applyTy(y,animated){ track.style.transition=animated?'transform 0.3s cubic-bezier(0.22,1,0.36,1)':'none'; track.style.transform=`translateY(${y}px)`; track.querySelectorAll('.drum-item').forEach((el,i)=>el.classList.toggle('sel',i===curIdx)); }
  function snap(animated=true){ curIdx=Math.max(0,Math.min(Math.round((DRUM_CTR-ty-ITEM_H/2)/ITEM_H),items.length-1)); ty=drumGetTy(curIdx); applyTy(ty,animated); onChange(curIdx,items[curIdx]); }
  applyTy(ty,false);
  let lastY=0,velY=0,lastT=0,down=false;
  wrapEl.addEventListener('pointerdown',e=>{ down=true; wrapEl.setPointerCapture(e.pointerId); lastY=e.clientY; velY=0; lastT=Date.now(); track.style.transition='none'; });
  wrapEl.addEventListener('pointermove',e=>{ if(!down) return; const now=Date.now(),dy=e.clientY-lastY; velY=dy/(now-lastT||1)*16; ty+=dy; const mn=drumGetTy(items.length-1),mx=drumGetTy(0); if(ty<mn) ty=mn+(ty-mn)*0.18; if(ty>mx) ty=mx+(ty-mx)*0.18; applyTy(ty,false); lastY=e.clientY; lastT=now; });
  wrapEl.addEventListener('pointerup',()=>{ down=false; let v=velY; function momentum(){ v*=0.93; ty+=v; const mn=drumGetTy(items.length-1),mx=drumGetTy(0); if(ty<mn||ty>mx){snap();return;} applyTy(ty,false); if(Math.abs(v)>0.5) requestAnimationFrame(momentum); else snap(); } if(Math.abs(v)>1) requestAnimationFrame(momentum); else snap(); });
  return { getIdx(){ return curIdx; }, getValue(){ return items[curIdx]; }, setIdx(idx,animated=true){ curIdx=Math.max(0,Math.min(idx,items.length-1)); ty=drumGetTy(curIdx); applyTy(ty,animated); } };
}

cats = ensureDefaults();
renderCatBar();
renderTimerControls();

updateRing(workTotal, workTotal);

    onApplied: () => {
      cats = ensureDefaults();
      renderCatBar();
      renderTimerControls();
      renderSessions();
      drawCharts();
      updateTodayCard();
    }
  });
}
