<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<meta name="color-scheme" content="dark">
<title>Focus — Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>
<style>
:root {
  --bg: #050506;
  --bg-card: rgba(255,255,255,0.04);
  --border: rgba(255,255,255,0.06);
  --border-strong: rgba(255,255,255,0.12);
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --accent: #6BE3A4;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  background: var(--bg); color: var(--text-secondary);
  font-family: var(--font); font-size: 15px; line-height: 1.5;
  -webkit-font-smoothing: antialiased; min-height: 100vh; overflow-x: hidden;
}
main {
  max-width: 480px; margin: 0 auto;
  padding: 14px max(14px, env(safe-area-inset-right)) 28px max(14px, env(safe-area-inset-left));
}

/* ── Mode tabs ── */
.f-mode-tabs {
  display: flex; gap: 3px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 12px; padding: 4px; margin-bottom: 12px;
}
.f-mode-tab {
  flex: 1; padding: 8px 0; background: none; border: none; border-radius: 9px;
  color: var(--text-tertiary); font-family: var(--font); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
}
.f-mode-tab.active { background: rgba(255,255,255,0.09); color: var(--text-primary); }

/* ── Timer card ── */
.f-timer-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 18px; padding: 22px 18px 20px; margin-bottom: 10px; text-align: center;
}
.f-cycle-opts { display: flex; gap: 6px; justify-content: center; margin-bottom: 14px; }
.f-cycle-btn {
  padding: 5px 13px; background: none;
  border: 1px solid var(--border-strong); border-radius: 20px;
  color: var(--text-tertiary); font-family: var(--font); font-size: 12px; font-weight: 600;
  cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
}
.f-cycle-btn.active {
  background: rgba(107,227,164,0.12); border-color: rgba(107,227,164,0.35); color: #6BE3A4;
}
.f-cd-row {
  display: flex; align-items: flex-end; justify-content: center; gap: 3px; margin-bottom: 14px;
}
.f-cd-col { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.f-cd-num {
  width: 66px; padding: 8px 4px; text-align: center; outline: none;
  background: rgba(255,255,255,0.06); border: 1px solid var(--border-strong);
  border-radius: 10px; color: var(--text-primary);
  font-family: var(--font-mono); font-size: 26px; font-weight: 700;
  -moz-appearance: textfield; transition: border-color 0.15s;
}
.f-cd-num::-webkit-outer-spin-button,
.f-cd-num::-webkit-inner-spin-button { -webkit-appearance: none; }
.f-cd-num:focus { border-color: rgba(255,255,255,0.24); }
.f-cd-unit { font-size: 10px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-tertiary); }
.f-cd-sep { font-size: 26px; font-weight: 700; color: var(--text-tertiary); padding-bottom: 20px; }
.f-display {
  font-family: var(--font-mono); font-size: clamp(54px, 18vw, 80px); font-weight: 700;
  letter-spacing: -2px; color: var(--text-primary); line-height: 1; margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}
.f-phase {
  font-size: 11px; color: var(--text-tertiary); font-weight: 700;
  letter-spacing: 0.10em; text-transform: uppercase; margin-bottom: 20px; min-height: 15px;
}
.f-controls { display: flex; gap: 8px; justify-content: center; }
.f-btn-primary {
  padding: 11px 24px;
  background: rgba(107,227,164,0.10); border: 1px solid rgba(107,227,164,0.28);
  border-radius: 12px; color: #6BE3A4; font-family: var(--font); font-size: 14px; font-weight: 700;
  cursor: pointer; transition: background 0.15s; -webkit-tap-highlight-color: transparent;
}
.f-btn-primary:hover { background: rgba(107,227,164,0.18); }
.f-btn-secondary {
  padding: 11px 18px;
  background: rgba(255,255,255,0.05); border: 1px solid var(--border-strong);
  border-radius: 12px; color: var(--text-secondary); font-family: var(--font); font-size: 14px; font-weight: 600;
  cursor: pointer; transition: background 0.15s; -webkit-tap-highlight-color: transparent;
}
.f-btn-secondary:hover { background: rgba(255,255,255,0.09); }
.f-lap-list {
  list-style: none; margin-top: 14px; max-height: 148px; overflow-y: auto;
  display: flex; flex-direction: column; gap: 4px;
}
.f-lap-item {
  display: flex; justify-content: space-between; padding: 6px 12px;
  background: rgba(255,255,255,0.04); border-radius: 8px;
  font-family: var(--font-mono); font-size: 13px; color: var(--text-secondary);
}
.f-lap-item.latest { color: var(--text-primary); }

/* ── Cards ── */
.f-card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: 18px; padding: 18px; margin-bottom: 10px;
}
.f-card-title {
  font-size: 11px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-tertiary); margin-bottom: 14px;
}

/* ── Timer log card ── */
.f-pending {
  text-align: center; padding: 8px 12px 12px;
  font-size: 13px; color: var(--text-tertiary);
}
.f-pending-dur {
  font-family: var(--font-mono); font-size: 32px; font-weight: 700;
  color: #6BE3A4; letter-spacing: -1px; display: block; margin-bottom: 4px;
}
.f-pending-hint { font-size: 12px; color: var(--text-tertiary); }
.f-log-ok {
  font-size: 13px; color: #6BE3A4; text-align: center;
  min-height: 18px; margin-top: 8px;
}
.f-row { display: flex; gap: 8px; margin-bottom: 10px; }
.f-cat-select {
  flex: 1; padding: 10px 12px;
  background: rgba(255,255,255,0.05); border: 1px solid var(--border-strong);
  border-radius: 10px; color: var(--text-primary); font-family: var(--font); font-size: 14px;
  outline: none; cursor: pointer; appearance: none; -webkit-appearance: none;
}
.f-icon-btn {
  width: 42px; height: 42px; flex-shrink: 0;
  background: rgba(255,255,255,0.05); border: 1px solid var(--border-strong);
  border-radius: 10px; color: var(--text-secondary); font-size: 20px; font-weight: 700;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; -webkit-tap-highlight-color: transparent;
}
.f-icon-btn:hover { background: rgba(255,255,255,0.09); }
.f-icon-btn.open { color: #6BE3A4; border-color: rgba(107,227,164,0.35); background: rgba(107,227,164,0.08); }

/* New category form */
.f-cat-form {
  background: rgba(255,255,255,0.03); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px; margin-bottom: 10px;
  display: flex; flex-direction: column; gap: 10px;
}
.f-cat-input {
  width: 100%; padding: 9px 12px; outline: none;
  background: rgba(255,255,255,0.05); border: 1px solid var(--border-strong);
  border-radius: 8px; color: var(--text-primary); font-family: var(--font); font-size: 14px;
  transition: border-color 0.15s;
}
.f-cat-input::placeholder { color: var(--text-tertiary); }
.f-cat-input:focus { border-color: rgba(255,255,255,0.22); }
.f-swatches { display: flex; gap: 8px; flex-wrap: wrap; }
.f-swatch {
  width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent;
  cursor: pointer; transition: transform 0.12s, border-color 0.12s; flex-shrink: 0;
}
.f-swatch:hover { transform: scale(1.15); }
.f-swatch.sel { border-color: rgba(255,255,255,0.6); transform: scale(1.1); }
.f-save-cat {
  padding: 9px; background: rgba(255,255,255,0.06); border: 1px solid var(--border-strong);
  border-radius: 8px; color: var(--text-secondary); font-family: var(--font); font-size: 13px; font-weight: 600;
  cursor: pointer; transition: background 0.15s; width: 100%;
}
.f-save-cat:hover { background: rgba(255,255,255,0.10); }

/* ── Apple-style calendar date picker ── */
.mc-field { margin-bottom: 8px; }
.mc-btn {
  width: 100%; padding: 11px 14px; text-align: left;
  background: rgba(255,255,255,0.05); border: 1px solid var(--border-strong);
  border-radius: 12px; font-family: var(--font); cursor: pointer;
  display: flex; justify-content: space-between; align-items: center;
  transition: background 0.15s; -webkit-tap-highlight-color: transparent;
}
.mc-btn:hover { background: rgba(255,255,255,0.09); }
.mc-btn-inner { display: flex; flex-direction: column; gap: 1px; }
.mc-btn-label {
  font-size: 9px; font-weight: 700; letter-spacing: 0.10em;
  text-transform: uppercase; color: var(--text-tertiary);
}
.mc-btn-val { font-size: 14px; color: var(--text-primary); font-weight: 500; }
.mc-btn-chevron {
  color: var(--text-tertiary); font-size: 11px; transition: transform 0.2s ease;
  flex-shrink: 0; margin-left: 8px;
}
.mc-btn.open .mc-btn-chevron { transform: rotate(180deg); }

.mc-panel {
  background: rgba(18,19,21,0.98); border: 1px solid rgba(255,255,255,0.1);
  border-radius: 16px; padding: 14px 12px 12px;
  margin-bottom: 8px; overflow: hidden;
  box-shadow: 0 16px 56px rgba(0,0,0,0.65), 0 2px 10px rgba(0,0,0,0.4);
  animation: mc-drop 0.2s cubic-bezier(0.22, 1, 0.36, 1);
}
@keyframes mc-drop {
  from { opacity: 0; transform: translateY(-8px) scale(0.98); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

/* Month header */
.mc-hdr {
  display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px;
}
.mc-nav-btn {
  width: 30px; height: 30px; border: none;
  background: rgba(255,255,255,0.08); border-radius: 50%;
  color: var(--text-secondary); font-size: 15px; line-height: 1;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.12s, opacity 0.12s; -webkit-tap-highlight-color: transparent; flex-shrink: 0;
}
.mc-nav-btn:hover:not(:disabled) { background: rgba(255,255,255,0.15); }
.mc-nav-btn:disabled { opacity: 0.18; cursor: default; }
.mc-month-name { font-size: 15px; font-weight: 700; color: var(--text-primary); }

/* Day grid */
.mc-weekdays {
  display: grid; grid-template-columns: repeat(7, 1fr);
  text-align: center; margin-bottom: 4px;
}
.mc-wd {
  font-size: 10px; font-weight: 600; color: var(--text-tertiary);
  letter-spacing: 0.03em; padding: 2px 0;
}
.mc-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
.mc-day {
  aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 500; color: var(--text-secondary);
  border-radius: 50%; cursor: pointer; position: relative;
  transition: background 0.1s, color 0.1s;
  user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent;
}
.mc-day:hover:not(.mc-other) { background: rgba(255,255,255,0.11); color: var(--text-primary); }
.mc-day.today { color: #6BE3A4; font-weight: 700; }
.mc-day.today::after {
  content: ''; position: absolute; bottom: 3px; left: 50%; transform: translateX(-50%);
  width: 3px; height: 3px; border-radius: 50%; background: #6BE3A4;
}
.mc-day.sel {
  background: #6BE3A4 !important; color: #050506 !important; font-weight: 800;
}
.mc-day.sel.today::after { display: none; }
.mc-other { opacity: 0.18; cursor: default; pointer-events: none; }

/* Time picker inside calendar */
.mc-time-row {
  display: flex; align-items: center; justify-content: center; gap: 4px;
  margin-top: 13px; padding-top: 13px; border-top: 1px solid var(--border);
}
.mc-time-cell { display: flex; flex-direction: column; align-items: center; gap: 3px; }
.mc-time-num {
  width: 56px; padding: 8px 0; text-align: center; outline: none;
  background: rgba(255,255,255,0.07); border: 1px solid var(--border-strong);
  border-radius: 10px; color: var(--text-primary);
  font-family: var(--font-mono); font-size: 22px; font-weight: 700;
  -moz-appearance: textfield; transition: border-color 0.15s; cursor: ns-resize;
}
.mc-time-num::-webkit-outer-spin-button,
.mc-time-num::-webkit-inner-spin-button { -webkit-appearance: none; }
.mc-time-num:focus { border-color: rgba(255,255,255,0.26); cursor: text; }
.mc-time-unit {
  font-size: 9px; font-weight: 700; text-transform: uppercase;
  color: var(--text-tertiary); letter-spacing: 0.07em;
}
.mc-time-sep { font-size: 22px; font-weight: 700; color: var(--text-tertiary); padding-bottom: 18px; }

/* ── Manual log card ── */
.f-man-dur {
  font-family: var(--font-mono); font-size: 30px; font-weight: 700;
  color: var(--text-primary); text-align: center; letter-spacing: -1px;
  margin: 2px 0 14px; min-height: 38px;
}
.f-man-dur.empty { color: var(--text-tertiary); font-size: 22px; font-weight: 400; letter-spacing: 0; }
.f-log-err { font-size: 12px; color: #FF8A8A; min-height: 16px; margin-bottom: 8px; }
.f-log-btn {
  width: 100%; padding: 12px;
  background: rgba(107,227,164,0.10); border: 1px solid rgba(107,227,164,0.28);
  border-radius: 12px; color: #6BE3A4; font-family: var(--font); font-size: 14px; font-weight: 700;
  cursor: pointer; transition: background 0.15s;
}
.f-log-btn:hover { background: rgba(107,227,164,0.18); }

/* ── Analytics ── */
.f-period-tabs {
  display: flex; gap: 3px;
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 8px; padding: 3px; margin-bottom: 14px;
}
.f-period-tab {
  flex: 1; padding: 6px 0; background: none; border: none; border-radius: 6px;
  color: var(--text-tertiary); font-family: var(--font); font-size: 11px; font-weight: 600;
  cursor: pointer; transition: all 0.15s; -webkit-tap-highlight-color: transparent;
}
.f-period-tab.active { background: rgba(255,255,255,0.09); color: var(--text-primary); }
.f-charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
@media (max-width: 340px) { .f-charts-row { grid-template-columns: 1fr; } }
.f-chart-wrap {
  background: rgba(255,255,255,0.025); border: 1px solid var(--border);
  border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 6px;
}
.f-chart-lbl { font-size: 9px; font-weight: 700; letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-tertiary); }
canvas { display: block; width: 100%; }
.f-legend { display: flex; flex-wrap: wrap; gap: 8px; }
.f-legend-item { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-secondary); }
.f-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.f-legend-val { color: var(--text-tertiary); font-size: 11px; }
.f-no-data { font-size: 12px; color: var(--text-tertiary); text-align: center; padding: 18px 0; }
</style>
</head>
<body>
<main>

  <!-- Mode tabs -->
  <div class="f-mode-tabs" id="fModeTabs">
    <button class="f-mode-tab active" data-mode="pomodoro">Pomodoro</button>
    <button class="f-mode-tab"        data-mode="countdown">Countdown</button>
    <button class="f-mode-tab"        data-mode="stopwatch">Stopwatch</button>
  </div>

  <!-- Timer card -->
  <div class="f-timer-card">
    <div class="f-cycle-opts" id="fCycleOpts">
      <button class="f-cycle-btn active" data-cycle="25-5">25 / 5</button>
      <button class="f-cycle-btn"        data-cycle="50-10">50 / 10</button>
      <button class="f-cycle-btn"        data-cycle="90-20">90 / 20</button>
    </div>
    <div class="f-cd-row" id="fCdRow" style="display:none">
      <div class="f-cd-col">
        <input type="number" class="f-cd-num" id="cdH" min="0" max="23" value="0">
        <span class="f-cd-unit">hr</span>
      </div>
      <span class="f-cd-sep">:</span>
      <div class="f-cd-col">
        <input type="number" class="f-cd-num" id="cdM" min="0" max="59" value="25">
        <span class="f-cd-unit">min</span>
      </div>
      <span class="f-cd-sep">:</span>
      <div class="f-cd-col">
        <input type="number" class="f-cd-num" id="cdS" min="0" max="59" value="0">
        <span class="f-cd-unit">sec</span>
      </div>
    </div>
    <div class="f-display" id="fDisplay">25:00</div>
    <div class="f-phase"   id="fPhase">Work · Round 1</div>
    <div class="f-controls">
      <button class="f-btn-primary"   id="fStartBtn">▶&ensp;Start</button>
      <button class="f-btn-secondary" id="fResetBtn">↺&ensp;Reset</button>
      <button class="f-btn-secondary" id="fLapBtn" style="display:none">Lap</button>
    </div>
    <ul class="f-lap-list" id="fLapList"></ul>
  </div>

  <!-- Timer log card -->
  <div class="f-card">
    <div class="f-card-title">Log Session</div>
    <div class="f-pending" id="fPending">
      <span class="f-pending-hint">Complete a timer session, then pick a category below to save it instantly.</span>
    </div>
    <div class="f-row">
      <select class="f-cat-select" id="fCatSelect">
        <option value="">— Pick a category —</option>
      </select>
      <button class="f-icon-btn" id="fCatNewBtn" title="New category">+</button>
    </div>
    <div class="f-cat-form" id="fCatForm" style="display:none">
      <input type="text" class="f-cat-input" id="fCatName" placeholder="Category name…" maxlength="30">
      <div class="f-swatches" id="fSwatches"></div>
      <button class="f-save-cat" id="fSaveCatBtn">Save Category</button>
    </div>
    <div class="f-log-ok" id="fLogOk"></div>
  </div>

  <!-- Manual past-session log card -->
  <div class="f-card">
    <div class="f-card-title">Log Past Session</div>
    <div class="f-row">
      <select class="f-cat-select" id="fManCatSelect">
        <option value="">— Pick a category —</option>
      </select>
      <button class="f-icon-btn" id="fManCatNewBtn" title="New category">+</button>
    </div>
    <div class="f-cat-form" id="fManCatForm" style="display:none">
      <input type="text" class="f-cat-input" id="fManCatName" placeholder="Category name…" maxlength="30">
      <div class="f-swatches" id="fManSwatches"></div>
      <button class="f-save-cat" id="fManSaveCatBtn">Save Category</button>
    </div>
    <!-- Calendar pickers injected by JS -->
    <div id="manStartWrap"></div>
    <div id="manEndWrap"></div>
    <div class="f-man-dur empty" id="fManDur">—</div>
    <div class="f-log-err" id="fManErr"></div>
    <button class="f-log-btn" id="fManLogBtn">Save Past Session</button>
  </div>

  <!-- Analytics card -->
  <div class="f-card">
    <div class="f-card-title">Analytics</div>
    <div class="f-period-tabs" id="fPeriodTabs">
      <button class="f-period-tab active" data-period="today">Today</button>
      <button class="f-period-tab"        data-period="7d">7 Days</button>
      <button class="f-period-tab"        data-period="month">Month</button>
      <button class="f-period-tab"        data-period="year">Year</button>
    </div>
    <div class="f-charts-row">
      <div class="f-chart-wrap">
        <div class="f-chart-lbl">Time by Category</div>
        <canvas id="fBarCanvas"></canvas>
      </div>
      <div class="f-chart-wrap">
        <div class="f-chart-lbl">Proportion</div>
        <canvas id="fDonutCanvas"></canvas>
      </div>
    </div>
    <div class="f-legend" id="fLegend"></div>
  </div>

</main>
<script>
(function () {
  'use strict';

  // ── Storage ───────────────────────────────────────────────────
  const K_CATS = 'focus:categories';
  const K_SESS = 'focus:sessions';
  const PALETTE = [
    '#6BE3A4','#7B9CEF','#FFB347','#FF6B6B','#C77DFF',
    '#38B6FF','#FCD34D','#F8A4C8','#6EE7B7','#FDBA74'
  ];

  function getCats() { try { return JSON.parse(localStorage.getItem(K_CATS)) || []; } catch { return []; } }
  function getSess() { try { return JSON.parse(localStorage.getItem(K_SESS)) || []; } catch { return []; } }
  function saveCats(d) { try { localStorage.setItem(K_CATS, JSON.stringify(d)); } catch {} }
  function saveSess(d) { try { localStorage.setItem(K_SESS, JSON.stringify(d)); } catch {} }

  // ── Completion chime ──────────────────────────────────────────
  function playChime() {
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      [523.25, 659.25, 783.99].forEach((freq, i) => {
        const osc = ac.createOscillator(), gain = ac.createGain();
        osc.connect(gain); gain.connect(ac.destination);
        osc.type = 'sine'; osc.frequency.value = freq;
        const t = ac.currentTime + i * 0.18;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.22, t + 0.025);
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 1.1);
        osc.start(t); osc.stop(t + 1.1);
      });
      setTimeout(() => { try { ac.close(); } catch {} }, 3000);
    } catch (e) {}
  }

  // ── Timer state ───────────────────────────────────────────────
  let mode      = 'pomodoro';
  let running   = false;
  let pomoWork  = 25, pomoBreak = 5;
  let pomoPhase = 'work', pomoRound = 1;
  let timerTotal = 25 * 60;
  let timerLeft  = 25 * 60;
  let startedAt  = 0;
  let pausedMs   = 0;
  let swLaps     = [];
  let ticker     = null;
  let pendingSession = null;

  const displayEl = document.getElementById('fDisplay');
  const phaseEl   = document.getElementById('fPhase');
  const startBtn  = document.getElementById('fStartBtn');
  const resetBtn  = document.getElementById('fResetBtn');
  const lapBtn    = document.getElementById('fLapBtn');
  const lapListEl = document.getElementById('fLapList');
  const cycleOpts = document.getElementById('fCycleOpts');
  const cdRow     = document.getElementById('fCdRow');

  // ── Format helpers ────────────────────────────────────────────
  function pad(n) { return String(Math.floor(n)).padStart(2, '0'); }
  function fmtS(s) {
    s = Math.max(0, Math.round(s));
    const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), ss = s % 60;
    return h > 0 ? h + ':' + pad(m) + ':' + pad(ss) : pad(m) + ':' + pad(ss);
  }
  function fmtMs(ms) { return fmtS(ms / 1000); }
  function durStr(s) { return s >= 3600 ? (s / 3600).toFixed(1) + 'h' : Math.round(s / 60) + 'm'; }

  // ── Timer core ────────────────────────────────────────────────
  function elapsedMs() { return pausedMs + (running ? Date.now() - startedAt : 0); }

  function renderDisplay() {
    if (mode === 'stopwatch') {
      displayEl.textContent = fmtMs(elapsedMs());
      phaseEl.textContent   = running ? 'Counting up…' : (pausedMs > 0 ? 'Paused' : '');
    } else {
      displayEl.textContent = fmtS(timerLeft);
      if (mode === 'pomodoro') {
        phaseEl.textContent = (pomoPhase === 'work' ? 'Work' : 'Break') + ' · Round ' + pomoRound;
      } else {
        phaseEl.textContent = running ? 'Counting down…' : (timerLeft > 0 && timerLeft < timerTotal ? 'Paused' : '');
      }
    }
    startBtn.textContent = running ? '⏸ Pause' : '▶ Start';
  }

  function tick() {
    if (mode === 'stopwatch') { renderDisplay(); return; }
    timerLeft = Math.max(0, timerTotal - elapsedMs() / 1000);
    renderDisplay();
    if (timerLeft === 0) onComplete();
  }

  function onComplete() {
    const worked = timerTotal;
    doPause();
    playChime();
    pendingSession = { durationSeconds: Math.round(worked), at: new Date().toISOString() };
    renderPending();
    if (mode === 'pomodoro') {
      if (pomoPhase === 'work') { pomoPhase = 'break'; timerTotal = pomoBreak * 60; }
      else { pomoPhase = 'work'; pomoRound++; timerTotal = pomoWork * 60; }
      timerLeft = timerTotal; pausedMs = 0;
      renderDisplay();
    } else {
      phaseEl.textContent = 'Done!';
    }
  }

  function renderPending() {
    const el = document.getElementById('fPending');
    if (pendingSession) {
      el.innerHTML = '<span class="f-pending-dur">' + fmtS(pendingSession.durationSeconds) + '</span>'
        + '<span class="f-pending-hint">Session complete — pick a category below to save it.</span>';
    } else {
      el.innerHTML = '<span class="f-pending-hint">Complete a timer session, then pick a category below to save it instantly.</span>';
    }
  }

  function doStart() {
    if (running) return;
    if (mode === 'countdown' && timerLeft <= 0) {
      const h = parseInt(document.getElementById('cdH').value) || 0;
      const m = parseInt(document.getElementById('cdM').value) || 0;
      const s = parseInt(document.getElementById('cdS').value) || 0;
      timerTotal = h * 3600 + m * 60 + s;
      timerLeft  = timerTotal; pausedMs = 0;
      if (timerTotal === 0) return;
    }
    running = true; startedAt = Date.now();
    ticker = setInterval(tick, 200);
    renderDisplay();
  }

  function doPause() {
    if (!running) return;
    clearInterval(ticker); ticker = null;
    running = false; pausedMs = elapsedMs();
    renderDisplay();
  }

  function doReset() {
    clearInterval(ticker); ticker = null;
    running = false; pausedMs = 0; swLaps = []; lapListEl.innerHTML = '';
    if (mode === 'pomodoro') {
      pomoPhase = 'work'; pomoRound = 1;
      timerTotal = pomoWork * 60; timerLeft = timerTotal;
    } else if (mode === 'countdown') {
      const h = parseInt(document.getElementById('cdH').value) || 0;
      const m = parseInt(document.getElementById('cdM').value) || 0;
      const s = parseInt(document.getElementById('cdS').value) || 0;
      timerTotal = h * 3600 + m * 60 + s; timerLeft = timerTotal;
    } else {
      timerTotal = 0; timerLeft = 0;
    }
    renderDisplay();
  }

  startBtn.addEventListener('click', () => { if (running) doPause(); else doStart(); });
  resetBtn.addEventListener('click', doReset);
  lapBtn.addEventListener('click', () => {
    const now = elapsedMs();
    const prev = swLaps.length ? swLaps[swLaps.length - 1].total : 0;
    swLaps.push({ total: now, lap: now - prev });
    renderLaps();
  });

  function renderLaps() {
    lapListEl.innerHTML = '';
    [...swLaps].reverse().forEach((l, ri) => {
      const n = swLaps.length - ri;
      const li = document.createElement('li');
      li.className = 'f-lap-item' + (ri === 0 ? ' latest' : '');
      li.innerHTML = '<span>Lap ' + n + '</span><span>' + fmtMs(l.lap) + '</span>';
      lapListEl.appendChild(li);
    });
  }

  // ── Mode switching ────────────────────────────────────────────
  function setMode(m) {
    mode = m;
    document.querySelectorAll('.f-mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === m));
    cycleOpts.style.display = m === 'pomodoro'  ? '' : 'none';
    cdRow.style.display     = m === 'countdown' ? '' : 'none';
    lapBtn.style.display    = m === 'stopwatch' ? '' : 'none';
    doReset();
  }

  document.getElementById('fModeTabs').querySelectorAll('.f-mode-tab').forEach(t =>
    t.addEventListener('click', () => setMode(t.dataset.mode)));

  cycleOpts.querySelectorAll('.f-cycle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      cycleOpts.querySelectorAll('.f-cycle-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const parts = btn.dataset.cycle.split('-').map(Number);
      pomoWork = parts[0]; pomoBreak = parts[1];
      doReset();
    });
  });

  ['cdH', 'cdM', 'cdS'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => { if (!running) doReset(); });
  });

  // ── Categories ────────────────────────────────────────────────
  let pickedColor    = PALETTE[0];
  let manPickedColor = PALETTE[0];

  function buildSwatches(wrapId, colorRef, setColor) {
    const wrap = document.getElementById(wrapId);
    wrap.innerHTML = '';
    PALETTE.forEach(c => {
      const el = document.createElement('div');
      el.className = 'f-swatch' + (c === colorRef ? ' sel' : '');
      el.style.background = c; el.dataset.c = c;
      el.addEventListener('click', () => {
        setColor(c);
        wrap.querySelectorAll('.f-swatch').forEach(s => s.classList.toggle('sel', s.dataset.c === c));
      });
      wrap.appendChild(el);
    });
  }

  function refreshCatSelects() {
    ['fCatSelect', 'fManCatSelect'].forEach(id => {
      const sel = document.getElementById(id);
      const cur = sel.value;
      sel.innerHTML = '<option value="">— Pick a category —</option>';
      getCats().forEach(cat => {
        const o = document.createElement('option');
        o.value = cat.id; o.textContent = cat.name;
        sel.appendChild(o);
      });
      if (cur) sel.value = cur;
    });
  }

  // Timer log — new category
  const catForm    = document.getElementById('fCatForm');
  const catNewBtn  = document.getElementById('fCatNewBtn');
  const catNameEl  = document.getElementById('fCatName');
  const saveCatBtn = document.getElementById('fSaveCatBtn');

  catNewBtn.addEventListener('click', () => {
    const open = catForm.style.display !== 'none';
    catForm.style.display = open ? 'none' : '';
    catNewBtn.classList.toggle('open', !open);
    if (!open) { buildSwatches('fSwatches', pickedColor, c => { pickedColor = c; }); catNameEl.focus(); }
  });

  function saveCategory(nameEl, formEl, newBtn, getColor) {
    const name = nameEl.value.trim();
    if (!name) { nameEl.focus(); return; }
    const cats = getCats();
    const id = 'cat_' + Date.now();
    cats.push({ id, name, color: getColor() });
    saveCats(cats);
    formEl.style.display = 'none'; newBtn.classList.remove('open');
    nameEl.value = '';
    refreshCatSelects();
    drawCharts();
    return id;
  }

  saveCatBtn.addEventListener('click', () => {
    const id = saveCategory(catNameEl, catForm, catNewBtn, () => pickedColor);
    if (id) document.getElementById('fCatSelect').value = id;
  });
  catNameEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); saveCatBtn.click(); }
    if (e.key === 'Escape') { catForm.style.display = 'none'; catNewBtn.classList.remove('open'); }
  });

  // Manual log — new category
  const manCatForm    = document.getElementById('fManCatForm');
  const manCatNewBtn  = document.getElementById('fManCatNewBtn');
  const manCatNameEl  = document.getElementById('fManCatName');
  const manSaveCatBtn = document.getElementById('fManSaveCatBtn');

  manCatNewBtn.addEventListener('click', () => {
    const open = manCatForm.style.display !== 'none';
    manCatForm.style.display = open ? 'none' : '';
    manCatNewBtn.classList.toggle('open', !open);
    if (!open) { buildSwatches('fManSwatches', manPickedColor, c => { manPickedColor = c; }); manCatNameEl.focus(); }
  });

  manSaveCatBtn.addEventListener('click', () => {
    const id = saveCategory(manCatNameEl, manCatForm, manCatNewBtn, () => manPickedColor);
    if (id) document.getElementById('fManCatSelect').value = id;
  });
  manCatNameEl.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); manSaveCatBtn.click(); }
    if (e.key === 'Escape') { manCatForm.style.display = 'none'; manCatNewBtn.classList.remove('open'); }
  });

  // ── Auto-log on category select (timer flow) ──────────────────
  document.getElementById('fCatSelect').addEventListener('change', () => {
    const catId = document.getElementById('fCatSelect').value;
    if (!catId || !pendingSession) return;
    const sess = getSess();
    sess.push({ id: 'sess_' + Date.now(), categoryId: catId,
      durationSeconds: pendingSession.durationSeconds, at: pendingSession.at });
    saveSess(sess);
    const catName = (getCats().find(c => c.id === catId) || {}).name || 'category';
    const okEl = document.getElementById('fLogOk');
    okEl.textContent = '✓ Saved ' + fmtS(pendingSession.durationSeconds) + ' to ' + catName;
    pendingSession = null; renderPending(); drawCharts();
    setTimeout(() => { okEl.textContent = ''; }, 2500);
  });

  // ── Apple-style calendar picker factory ───────────────────────
  const MONTH_NAMES  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
  const SHORT_MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const WEEK_DAYS    = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const THIS_YEAR    = new Date().getFullYear();

  // Track all open panels so we can close others
  const allPickers = [];

  function makeCalPicker(containerEl, labelText, initDate, onChange) {
    let sel  = new Date(initDate); sel.setSeconds(0, 0);
    let viewM = sel.getMonth();

    const todayMidnight = new Date(); todayMidnight.setHours(0,0,0,0);

    // ── Build DOM ──
    const field = document.createElement('div');
    field.className = 'mc-field';

    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'mc-btn';
    btn.innerHTML =
      '<div class="mc-btn-inner">' +
        '<div class="mc-btn-label">' + labelText + '</div>' +
        '<div class="mc-btn-val"></div>' +
      '</div>' +
      '<span class="mc-btn-chevron">▾</span>';
    const btnVal = btn.querySelector('.mc-btn-val');

    const panel = document.createElement('div');
    panel.className = 'mc-panel';
    panel.style.display = 'none';

    // Header
    const hdr = document.createElement('div'); hdr.className = 'mc-hdr';
    const prevBtn   = document.createElement('button'); prevBtn.type='button'; prevBtn.className='mc-nav-btn'; prevBtn.textContent='‹';
    const monthName = document.createElement('div');   monthName.className='mc-month-name';
    const nextBtn   = document.createElement('button'); nextBtn.type='button'; nextBtn.className='mc-nav-btn'; nextBtn.textContent='›';
    hdr.append(prevBtn, monthName, nextBtn);

    // Weekday labels
    const wdRow = document.createElement('div'); wdRow.className = 'mc-weekdays';
    WEEK_DAYS.forEach(d => { const s = document.createElement('div'); s.className='mc-wd'; s.textContent=d; wdRow.appendChild(s); });

    // Days grid
    const daysGrid = document.createElement('div'); daysGrid.className = 'mc-days';

    // Time row
    const timeRow = document.createElement('div'); timeRow.className = 'mc-time-row';

    const hCell = document.createElement('div'); hCell.className = 'mc-time-cell';
    const hInput = document.createElement('input'); hInput.type='number'; hInput.className='mc-time-num'; hInput.min=0; hInput.max=23; hInput.value=pad(sel.getHours());
    const hUnit  = document.createElement('div');  hUnit.className='mc-time-unit'; hUnit.textContent='hr';
    hCell.append(hInput, hUnit);

    const sep = document.createElement('div'); sep.className='mc-time-sep'; sep.textContent=':';

    const mCell = document.createElement('div'); mCell.className = 'mc-time-cell';
    const mInput = document.createElement('input'); mInput.type='number'; mInput.className='mc-time-num'; mInput.min=0; mInput.max=59; mInput.value=pad(sel.getMinutes());
    const mUnit  = document.createElement('div');  mUnit.className='mc-time-unit'; mUnit.textContent='min';
    mCell.append(mInput, mUnit);

    timeRow.append(hCell, sep, mCell);
    panel.append(hdr, wdRow, daysGrid, timeRow);
    field.append(btn, panel);
    containerEl.appendChild(field);

    // ── Helpers ──
    function daysInMonth(m) { return new Date(THIS_YEAR, m + 1, 0).getDate(); }

    function getDate() {
      const h = Math.min(23, Math.max(0, parseInt(hInput.value) || 0));
      const m = Math.min(59, Math.max(0, parseInt(mInput.value) || 0));
      return new Date(THIS_YEAR, sel.getMonth(), sel.getDate(), h, m, 0, 0);
    }

    function fmtBtn(d) {
      const h = d.getHours(), m = d.getMinutes();
      const ampm = h >= 12 ? 'PM' : 'AM';
      const h12  = h % 12 || 12;
      const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
      return days[d.getDay()] + ', ' + SHORT_MONTHS[d.getMonth()] + ' ' + d.getDate()
        + '  ·  ' + h12 + ':' + pad(m) + ' ' + ampm;
    }

    function updateBtn() { btnVal.textContent = fmtBtn(getDate()); }

    function renderGrid() {
      daysGrid.innerHTML = '';
      prevBtn.disabled = viewM === 0;
      nextBtn.disabled = viewM === 11;
      monthName.textContent = MONTH_NAMES[viewM] + ' ' + THIS_YEAR;

      const firstDay  = new Date(THIS_YEAR, viewM, 1).getDay();
      const daysCount = daysInMonth(viewM);
      const prevCount = viewM > 0 ? daysInMonth(viewM - 1) : 0;

      // Leading overflow from previous month
      for (let i = 0; i < firstDay; i++) {
        const cell = document.createElement('div');
        cell.className = 'mc-day mc-other';
        if (viewM > 0) cell.textContent = prevCount - firstDay + 1 + i;
        daysGrid.appendChild(cell);
      }

      // Current month
      const selM = sel.getMonth(), selD = sel.getDate();
      for (let d = 1; d <= daysCount; d++) {
        const cell = document.createElement('div'); cell.className = 'mc-day';
        cell.textContent = d;
        const cellDate = new Date(THIS_YEAR, viewM, d); cellDate.setHours(0,0,0,0);
        if (+cellDate === +todayMidnight) cell.classList.add('today');
        if (viewM === selM && d === selD) cell.classList.add('sel');
        cell.addEventListener('click', () => {
          sel = new Date(THIS_YEAR, viewM, d, parseInt(hInput.value)||0, parseInt(mInput.value)||0, 0, 0);
          renderGrid(); updateBtn(); onChange(getDate());
        });
        daysGrid.appendChild(cell);
      }

      // Trailing overflow to next month (fill to 42 cells)
      const trailing = 42 - (firstDay + daysCount);
      for (let i = 1; i <= trailing; i++) {
        const cell = document.createElement('div');
        cell.className = 'mc-day mc-other';
        if (viewM < 11) cell.textContent = i;
        daysGrid.appendChild(cell);
      }
    }

    function open()  { panel.style.display = ''; btn.classList.add('open'); viewM = sel.getMonth(); renderGrid(); }
    function close() { panel.style.display = 'none'; btn.classList.remove('open'); }
    function toggle() { panel.style.display === 'none' ? open() : close(); }

    // ── Events ──
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      // Close sibling pickers
      allPickers.forEach(p => { if (p !== api) p.close(); });
      toggle();
    });

    prevBtn.addEventListener('click', (e) => { e.stopPropagation(); if (viewM > 0) { viewM--; renderGrid(); } });
    nextBtn.addEventListener('click', (e) => { e.stopPropagation(); if (viewM < 11) { viewM++; renderGrid(); } });

    [hInput, mInput].forEach(inp => {
      const max = inp === hInput ? 23 : 59;
      inp.addEventListener('change', () => {
        let v = parseInt(inp.value);
        if (isNaN(v)) v = 0;
        inp.value = pad(Math.min(max, Math.max(0, v)));
        updateBtn(); onChange(getDate());
      });
      inp.addEventListener('wheel', (e) => {
        e.preventDefault(); e.stopPropagation();
        let v = parseInt(inp.value) + (e.deltaY < 0 ? 1 : -1);
        inp.value = pad(Math.min(max, Math.max(0, v)));
        updateBtn(); onChange(getDate());
      }, { passive: false });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowUp' || e.key === 'ArrowDown') {
          e.preventDefault();
          let v = parseInt(inp.value) + (e.key === 'ArrowUp' ? 1 : -1);
          inp.value = pad(Math.min(max, Math.max(0, v)));
          updateBtn(); onChange(getDate());
        }
      });
    });

    // ── API ──
    const api = {
      getDate,
      setDate(d) {
        sel = new Date(d); sel.setSeconds(0, 0);
        viewM = sel.getMonth();
        hInput.value = pad(sel.getHours());
        mInput.value = pad(sel.getMinutes());
        updateBtn();
      },
      close
    };

    updateBtn();
    allPickers.push(api);
    return api;
  }

  // Close all pickers on outside click
  document.addEventListener('click', () => { allPickers.forEach(p => p.close()); });

  // ── Manual past-session log ───────────────────────────────────
  const now0      = new Date();
  const startInit = new Date(now0.getTime() - 3600000);

  const manStartPicker = makeCalPicker(document.getElementById('manStartWrap'), 'Started', startInit, updateManDur);
  const manEndPicker   = makeCalPicker(document.getElementById('manEndWrap'),   'Stopped', now0,      updateManDur);

  function updateManDur() {
    const s = manStartPicker.getDate(), e = manEndPicker.getDate();
    const el = document.getElementById('fManDur');
    if (e > s) {
      el.textContent = fmtS(Math.round((e - s) / 1000));
      el.classList.remove('empty');
    } else {
      el.textContent = '—'; el.classList.add('empty');
    }
  }

  document.getElementById('fManLogBtn').addEventListener('click', () => {
    const errEl = document.getElementById('fManErr');
    const catId = document.getElementById('fManCatSelect').value;
    if (!catId) { errEl.textContent = 'Pick a category first.'; return; }
    const s = manStartPicker.getDate(), e = manEndPicker.getDate();
    if (e <= s) { errEl.textContent = 'Stop time must be after start time.'; return; }
    errEl.textContent = '';
    const dur = Math.round((e - s) / 1000);
    const sess = getSess();
    sess.push({ id: 'sess_' + Date.now(), categoryId: catId, durationSeconds: dur, at: s.toISOString() });
    saveSess(sess); drawCharts();
    const btn = document.getElementById('fManLogBtn');
    btn.textContent = '✓ Saved';
    setTimeout(() => { btn.textContent = 'Save Past Session'; }, 1400);
    const newNow = new Date();
    manStartPicker.setDate(new Date(newNow.getTime() - 3600000));
    manEndPicker.setDate(newNow);
    updateManDur();
  });

  // ── Period / Analytics ────────────────────────────────────────
  let period = 'today';

  document.getElementById('fPeriodTabs').querySelectorAll('.f-period-tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.f-period-tab').forEach(b => b.classList.remove('active'));
      t.classList.add('active'); period = t.dataset.period; drawCharts();
    });
  });

  function periodCutoff(p) {
    const n = new Date();
    if (p === 'today')  return new Date(n.getFullYear(), n.getMonth(), n.getDate()).getTime();
    if (p === '7d')     return Date.now() - 7 * 86400000;
    if (p === 'month')  return new Date(n.getFullYear(), n.getMonth(), 1).getTime();
    return new Date(n.getFullYear(), 0, 1).getTime();
  }

  function aggregate(p) {
    const cats = getCats(), sess = getSess(), since = periodCutoff(p);
    const byId = {};
    sess.forEach(s => {
      if (new Date(s.at).getTime() < since) return;
      byId[s.categoryId] = (byId[s.categoryId] || 0) + s.durationSeconds;
    });
    return cats.map(c => ({ ...c, secs: byId[c.id] || 0 })).filter(c => c.secs > 0);
  }

  // ── Charts ────────────────────────────────────────────────────
  function setupCanvas(id, H) {
    const canvas = document.getElementById(id);
    const W = (canvas.parentElement.clientWidth || 160) - 20;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = W * dpr; canvas.height = H * dpr;
    canvas.style.height = H + 'px';
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr, dpr); ctx.clearRect(0, 0, W, H);
    return { ctx, W, H };
  }

  function drawBar(data) {
    const { ctx, W, H } = setupCanvas('fBarCanvas', 148);
    if (!data.length) {
      ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.font = '11px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('No data yet', W / 2, H / 2); return;
    }
    const pL = 4, pR = 4, pT = 18, pB = 26;
    const aW = W - pL - pR, aH = H - pT - pB;
    const n = data.length, gap = Math.min(8, aW / n * 0.2);
    const bW = (aW - gap * (n - 1)) / n;
    const maxS = Math.max(...data.map(d => d.secs));
    data.forEach((d, i) => {
      const bH = maxS > 0 ? (d.secs / maxS) * aH : 0;
      const x = pL + i * (bW + gap), y = pT + aH - bH;
      const r = Math.min(4, bW / 2, Math.max(0, bH));
      ctx.fillStyle = d.color; ctx.beginPath();
      if (bH >= r * 2) {
        ctx.moveTo(x + r, y); ctx.lineTo(x + bW - r, y);
        ctx.arcTo(x + bW, y, x + bW, y + r, r);
        ctx.lineTo(x + bW, y + bH); ctx.lineTo(x, y + bH);
        ctx.arcTo(x, y, x + r, y, r); ctx.closePath();
      } else { ctx.rect(x, y, bW, Math.max(2, bH)); }
      ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.font = '8px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(d.name.length > 5 ? d.name.slice(0, 4) + '…' : d.name, x + bW / 2, H - pB + 10);
      if (bH > 4) {
        ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = '8px sans-serif';
        ctx.fillText(durStr(d.secs), x + bW / 2, y - 3);
      }
    });
  }

  function drawDonut(data) {
    const { ctx, W, H } = setupCanvas('fDonutCanvas', 148);
    const cx = W / 2, cy = H / 2;
    const outer = Math.min(cx, cy) - 6, inner = outer * 0.56;
    const mid = (outer + inner) / 2, lw = outer - inner;
    if (!data.length) {
      ctx.strokeStyle = 'rgba(255,255,255,0.07)'; ctx.lineWidth = lw;
      ctx.beginPath(); ctx.arc(cx, cy, mid, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,0.2)'; ctx.font = '11px sans-serif';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText('No data', cx, cy); return;
    }
    const total = data.reduce((s, d) => s + d.secs, 0);
    const GAP = data.length > 1 ? 0.035 : 0;
    let a = -Math.PI / 2; ctx.lineWidth = lw;
    data.forEach(d => {
      const sweep = (d.secs / total) * Math.PI * 2 - GAP;
      if (sweep > 0) {
        ctx.strokeStyle = d.color;
        ctx.beginPath(); ctx.arc(cx, cy, mid, a + GAP / 2, a + GAP / 2 + sweep); ctx.stroke();
      }
      a += (d.secs / total) * Math.PI * 2;
    });
    ctx.fillStyle = 'rgba(255,255,255,0.88)'; ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(durStr(total), cx, cy - 7);
    ctx.fillStyle = 'rgba(255,255,255,0.3)'; ctx.font = '9px sans-serif';
    ctx.fillText('total', cx, cy + 8);
  }

  function drawLegend(data) {
    const el = document.getElementById('fLegend'); el.innerHTML = '';
    if (!data.length) { el.innerHTML = '<div class="f-no-data">No sessions logged yet.</div>'; return; }
    data.forEach(d => {
      const item = document.createElement('div'); item.className = 'f-legend-item';
      item.innerHTML = '<span class="f-legend-dot" style="background:' + d.color + '"></span>'
        + d.name + '&ensp;<span class="f-legend-val">' + durStr(d.secs) + '</span>';
      el.appendChild(item);
    });
  }

  function drawCharts() {
    const data = aggregate(period);
    drawBar(data); drawDonut(data); drawLegend(data);
  }

  // ── Init ──────────────────────────────────────────────────────
  refreshCatSelects();
  buildSwatches('fSwatches', pickedColor, c => { pickedColor = c; });
  buildSwatches('fManSwatches', manPickedColor, c => { manPickedColor = c; });
  setMode('pomodoro');
  renderPending();
  updateManDur();
  requestAnimationFrame(drawCharts);

  if (window.ResizeObserver) {
    new ResizeObserver(() => requestAnimationFrame(drawCharts))
      .observe(document.querySelector('main'));
  }

  window.addEventListener('load', () => {
    if (window.initCloudSync) {
      initCloudSync({
        appKey: 'focus',
        syncedKeys: [K_CATS, K_SESS],
        onApplied() { refreshCatSelects(); drawCharts(); }
      });
    }
  });

})();
</script>
</body>
</html>
